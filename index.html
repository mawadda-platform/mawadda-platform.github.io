<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مودة | منصة الزواج الجاد</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --c-bg:#faf7f2; --c-surface:#ffffff; --c-surface-2:#f3ede3;
  --c-primary:#7a4a3a; --c-primary-dark:#5c362a; --c-primary-light:#a9705b;
  --c-accent:#b08d57; --c-accent-light:#e7d9bd;
  --c-text:#2c2420; --c-text-muted:#7a6f66; --c-border:#e6ddd0;
  --c-success:#3f7d5c; --c-success-bg:#e5f3ec;
  --c-warn:#a97514; --c-warn-bg:#fbf1de;
  --c-danger:#a33b3b; --c-danger-bg:#fbe9e9;
  --c-info:#3a6ea5; --c-info-bg:#e8f1fb;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 10px rgba(60,40,25,0.08);
  --shadow-lg:0 10px 30px rgba(60,40,25,0.14);
  --maxw:1080px;
  --header-h:64px; --bottomnav-h:64px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px));}
body{
  margin:0; font-family:'Tajawal',system-ui,sans-serif; background:var(--c-bg); color:var(--c-text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{margin:0 0 8px; font-weight:900; line-height:1.3;}
p{line-height:1.8; color:var(--c-text-muted); margin:0 0 10px;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px;}

/* Header */
.header{
  position:sticky; top:0; z-index:40; background:rgba(250,247,242,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--c-border); padding-top:env(safe-area-inset-top,0px);
}
.header-inner{max-width:var(--maxw); margin:0 auto; height:var(--header-h); display:flex; align-items:center; justify-content:space-between; padding:0 16px;}
.brand{display:flex; align-items:center; gap:8px; font-weight:900; font-size:22px; color:var(--c-primary); cursor:pointer;}
.brand .dot{color:var(--c-accent);}
.header-actions{display:flex; align-items:center; gap:10px;}
.nav-desktop{display:none; gap:4px;}
@media(min-width:860px){ .nav-desktop{display:flex;} }
.nav-link{padding:9px 14px; border-radius:99px; font-weight:700; font-size:14px; cursor:pointer; color:var(--c-text-muted); white-space:nowrap;}
.nav-link.active{background:var(--c-primary); color:#fff;}
.nav-link:hover:not(.active){background:var(--c-surface-2);}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:99px; padding:11px 22px; font-weight:700; font-size:15px; cursor:pointer; transition:.15s; white-space:nowrap;}
.btn-primary{background:var(--c-primary); color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:transparent; color:var(--c-primary); border:1.5px solid var(--c-primary);}
.btn-outline:hover{background:var(--c-surface-2);}
.btn-ghost{background:transparent; color:var(--c-text-muted);}
.btn-ghost:hover{background:var(--c-surface-2);}
.btn-danger{background:var(--c-danger); color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-success{background:var(--c-success); color:#fff;}
.btn-sm{padding:7px 14px; font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Layout */
.container{max-width:var(--maxw); margin:0 auto; padding:24px 16px 48px;}
.container.narrow{max-width:520px;}
.grid{display:grid; gap:16px;}
@media(min-width:700px){ .grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} }

/* Cards */
.card{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.card-tight{padding:14px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h3{margin:0;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700;}
.badge-success{background:var(--c-success-bg); color:var(--c-success);}
.badge-warn{background:var(--c-warn-bg); color:var(--c-warn);}
.badge-danger{background:var(--c-danger-bg); color:var(--c-danger);}
.badge-info{background:var(--c-info-bg); color:var(--c-info);}
.badge-muted{background:var(--c-surface-2); color:var(--c-text-muted);}
.chip{display:inline-block; padding:4px 12px; border-radius:99px; background:var(--c-surface-2); color:var(--c-text); font-size:13px; font-weight:500; margin:2px;}
.chip-select{cursor:pointer; border:1.5px solid var(--c-border); background:var(--c-surface);}
.chip-select.on{background:var(--c-primary); border-color:var(--c-primary); color:#fff;}

/* Forms */
label{display:block; font-weight:700; font-size:13px; margin:14px 0 5px; color:var(--c-text);}
label:first-child{margin-top:0;}
.hint{font-size:12px; color:var(--c-text-muted); margin-top:4px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--c-border);
  background:var(--c-surface); font-family:inherit; font-size:15px; color:var(--c-text);
}
textarea{resize:vertical; min-height:90px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--c-primary);}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field-error{color:var(--c-danger); font-size:12.5px; margin-top:4px;}
fieldset{border:1px solid var(--c-border); border-radius:var(--radius-sm); padding:12px 14px; margin:14px 0 0;}
legend{font-weight:700; font-size:13px; padding:0 6px;}

/* Progress */
.progress{height:9px; background:var(--c-surface-2); border-radius:99px; overflow:hidden;}
.progress > div{height:100%; background:linear-gradient(90deg,var(--c-accent),var(--c-primary)); border-radius:99px; transition:width .3s;}

/* Toast */
#toast-container{position:fixed; top:calc(var(--header-h) + 12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:min(92vw,380px);}
.toast{padding:12px 16px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); font-size:14px; font-weight:600; color:#fff; animation:slidein .2s ease;}
.toast-success{background:var(--c-success);} .toast-error{background:var(--c-danger);} .toast-info{background:var(--c-primary);}
@keyframes slidein{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(30,20,15,0.5); z-index:150; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:640px){ .modal-backdrop{align-items:center;} }
.modal{background:var(--c-surface); border-radius:18px 18px 0 0; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow-lg);}
@media(min-width:640px){ .modal{border-radius:var(--radius);} }

/* Empty / loading / error states */
.state-box{text-align:center; padding:40px 20px; color:var(--c-text-muted);}
.state-box .icon{font-size:40px; margin-bottom:10px;}
.spinner{width:34px; height:34px; border:3px solid var(--c-surface-2); border-top-color:var(--c-primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--c-surface-2) 25%,#eee5d7 37%,var(--c-surface-2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-sm); height:80px;}
@keyframes sk{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}

/* Bottom nav (mobile) */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--c-surface); border-top:1px solid var(--c-border);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);}
@media(min-width:860px){ .bottom-nav{display:none;} }
.bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 2px; font-size:11px; font-weight:700; color:var(--c-text-muted); cursor:pointer;}
.bn-item.active{color:var(--c-primary);}
.bn-icon{font-size:19px;}
body.has-bottomnav .container{padding-bottom:calc(var(--bottomnav-h) + 24px);}

/* Hero */
.hero{padding:48px 0 32px; text-align:center;}
.hero h1{font-size:clamp(28px,5vw,44px); color:var(--c-primary-dark);}
.hero p.lead{font-size:17px; max-width:560px; margin:0 auto 22px;}
.hero-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.feature-list{display:grid; gap:14px; margin-top:30px;}
@media(min-width:700px){ .feature-list{grid-template-columns:repeat(3,1fr);} }
.feature-item{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:18px; text-align:center;}
.feature-item .emoji{font-size:30px; margin-bottom:8px;}
.steps{counter-reset:step; display:grid; gap:14px; margin-top:14px;}
.step{display:flex; gap:14px; align-items:flex-start; background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:16px;}
.step-num{flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--c-primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900;}

/* candidate card */
.cand-card{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:.15s;}
.cand-card:hover{box-shadow:var(--shadow-lg); border-color:var(--c-accent);}
.cand-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.cand-age{font-weight:900; font-size:20px; color:var(--c-primary-dark);}

/* misc */
.muted{color:var(--c-text-muted);}
.center{text-align:center;}
.mt0{margin-top:0;} .mb0{margin-bottom:0;}
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.gap8{gap:8px;} .gap12{gap:12px;}
.tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--c-border); margin-bottom:16px; overflow-x:auto;}
.tab{padding:10px 16px; font-weight:700; color:var(--c-text-muted); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;}
.tab.active{color:var(--c-primary); border-color:var(--c-primary);}
.hr{border:none; border-top:1px solid var(--c-border); margin:16px 0;}
.coming-soon{opacity:.55; position:relative;}
.list-empty-illustration{font-size:44px;}

/* =========================================================
   MAWADDA REDESIGN — v3
========================================================= */
:root{
  --c-bg:#f6f7f9; --c-surface:#ffffff; --c-surface-2:#f0f2f5;
  --c-primary:#274c45; --c-primary-dark:#19372f; --c-primary-light:#4f786e;
  --c-accent:#b9975b; --c-accent-light:#eee4d0;
  --c-text:#1f2926; --c-text-muted:#6d7773; --c-border:#dde3e0;
  --c-success:#2f7657; --c-success-bg:#e7f4ed;
  --c-warn:#a06c16; --c-warn-bg:#fbf2df;
  --c-danger:#a34343; --c-danger-bg:#f9e9e9;
  --c-info:#3c678a; --c-info-bg:#e8f1f8;
  --radius:18px; --radius-sm:12px;
  --shadow:0 4px 18px rgba(25,45,39,.06);
  --shadow-lg:0 18px 45px rgba(25,45,39,.12);
  --maxw:1180px; --sidebar-w:248px;
}
html[data-theme="dark"]{
  --c-bg:#111816; --c-surface:#18211e; --c-surface-2:#202b27;
  --c-primary:#8fb8ad; --c-primary-dark:#b8d2ca; --c-primary-light:#6e9d91;
  --c-accent:#d1b276; --c-accent-light:#3a3327;
  --c-text:#edf3f0; --c-text-muted:#aab8b3; --c-border:#2d3935;
  --c-success:#74b894; --c-success-bg:#173126;
  --c-warn:#e0b86d; --c-warn-bg:#352a18;
  --c-danger:#df8585; --c-danger-bg:#351e20;
  --c-info:#8eb8dc; --c-info-bg:#1d2c38;
  --shadow:0 4px 20px rgba(0,0,0,.18); --shadow-lg:0 20px 50px rgba(0,0,0,.32);
}
html[data-theme="dark"] .header{background:rgba(17,24,22,.88);}
html[data-theme="dark"] .btn-primary{color:#10201b;}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color-scheme:dark;}
html[data-theme="dark"] .skeleton{background:linear-gradient(90deg,#202b27 25%,#2a3732 37%,#202b27 63%);}

body{background:var(--c-bg); color:var(--c-text);}
.header{height:68px; background:color-mix(in srgb,var(--c-bg) 92%,transparent); border-bottom-color:var(--c-border);}
.header-inner{height:68px; max-width:1280px;}
.brand{font-size:24px; letter-spacing:-.4px;}
.brand:before{content:""; width:10px; height:10px; border-radius:50%; background:var(--c-accent); display:inline-block; margin-inline-end:2px;}
.nav-desktop{display:none!important;}
.header-actions{gap:8px;}
.header-actions .badge{max-width:130px; overflow:hidden; text-overflow:ellipsis;}
.container{max-width:1180px; padding:34px 22px 70px;}
.container.narrow{max-width:620px;}
.card{border-radius:18px; box-shadow:var(--shadow); border-color:var(--c-border);}
.btn{min-height:42px; border-radius:12px; padding:10px 17px;}
.btn-primary{background:var(--c-primary);}
.btn-outline{border-color:var(--c-border); background:var(--c-surface); color:var(--c-text);}
.btn-outline:hover{border-color:var(--c-primary); color:var(--c-primary);}
.btn-danger{background:var(--c-danger);}
.btn-success{background:var(--c-success);}
label{margin-top:18px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{background:var(--c-surface); border-color:var(--c-border); min-height:46px;}
textarea{min-height:110px;}
.section-title{margin:34px 0 14px;}
.progress{height:8px;}
.modal-backdrop{background:rgba(10,18,15,.62); backdrop-filter:blur(4px);}
.modal{background:var(--c-surface); border:1px solid var(--c-border);}

#desktop-sidebar{display:none;}
@media(min-width:860px){
  #desktop-sidebar{
    display:block; position:fixed; top:68px; right:0; bottom:0; width:var(--sidebar-w);
    background:var(--c-surface); border-left:1px solid var(--c-border); z-index:35;
    padding:22px 14px; overflow:auto;
  }
  body:has(#desktop-sidebar:not(:empty)) .header-inner{padding-right:calc(var(--sidebar-w) + 18px);}
  body:has(#desktop-sidebar:not(:empty)) #app{margin-right:var(--sidebar-w);}
  .bottom-nav{display:none!important;}
}
.sidebar-section{margin:10px 0 8px; padding:0 10px; color:var(--c-text-muted); font-size:11px; font-weight:900; letter-spacing:.4px;}
.sidebar-link{display:flex; align-items:center; gap:11px; width:100%; padding:11px 12px; border-radius:12px; color:var(--c-text-muted); font-weight:700; cursor:pointer; margin:2px 0;}
.sidebar-link:hover{background:var(--c-surface-2); color:var(--c-text);}
.sidebar-link.active{background:var(--c-primary); color:#fff;}
.sidebar-icon{width:23px; text-align:center; font-size:17px;}
.sidebar-divider{height:1px;background:var(--c-border);margin:14px 8px;}
.theme-switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--c-border);border-radius:12px;background:var(--c-surface);cursor:pointer;font-weight:700;}
.theme-switch .theme-icon{font-size:18px;}
@media(max-width:859px){
  .header-inner{padding:0 14px;}
  .header-actions .member-code{display:none;}
  .container{padding:24px 14px 92px;}
  .hero{padding:40px 14px 24px;}
}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;}
.page-heading h1,.page-heading h2{margin-bottom:4px;}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--c-primary);font-weight:900;font-size:12px;margin-bottom:7px;}
.eyebrow:before{content:"";width:20px;height:2px;background:var(--c-accent);}
.hero-redesign{position:relative;overflow:hidden;padding:64px 0 42px;}
.hero-redesign:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--c-accent-light);opacity:.35;top:-210px;left:-100px;pointer-events:none;}
.hero-grid{display:grid;gap:26px;align-items:center;}
.hero-copy{position:relative;z-index:1;}
.hero-copy h1{font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-1.5px;color:var(--c-primary-dark);max-width:760px;}
.hero-copy .lead{font-size:18px;max-width:690px;margin:18px 0 25px;}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.hero-badge{padding:7px 11px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);font-size:12px;font-weight:700;}
.hero-panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg);}
.hero-panel .panel-mark{font-size:42px;margin-bottom:12px;}
.feature-grid{display:grid;gap:14px;}
.feature-block{padding:24px;border-top:3px solid var(--c-accent);background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;}
.feature-block p{margin-bottom:0;}
.steps-redesign{display:grid;gap:12px;}
.step-redesign{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:17px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;}
.step-redesign .num{width:42px;height:42px;border-radius:12px;background:var(--c-primary);color:#fff;display:grid;place-items:center;font-weight:900;}
.cta-band{margin-top:34px;padding:28px;border-radius:20px;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.cta-band p{color:rgba(255,255,255,.78);margin:3px 0 0;}
.cta-band .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);}
.site-footer{border-top:1px solid var(--c-border);padding:28px 0;color:var(--c-text-muted);}
.auth-shell{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:28px 14px;}
.auth-card{width:min(100%,520px);background:var(--c-surface);border:1px solid var(--c-border);border-radius:22px;padding:28px;box-shadow:var(--shadow-lg);}
.auth-card .auth-mark{font-size:34px;margin-bottom:10px;}
.auth-card h2{font-size:28px;}
.auth-note{padding:12px 14px;background:var(--c-surface-2);border-radius:12px;margin:14px 0;font-size:13px;color:var(--c-text-muted);}
.pw-field{position:relative;}
.pw-field input{padding-left:42px !important; width:100%;}
.pw-toggle{position:absolute; left:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:17px; padding:6px; line-height:1; color:var(--c-text-muted);}
.pw-toggle:hover{color:var(--c-text);}
.pw-match-msg{font-size:12.5px; margin-top:4px;}
.pw-match-msg.ok{color:var(--c-success, #16a34a);}
.pw-match-msg.bad{color:var(--c-danger);}
.oauth-divider{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--c-text-muted); font-size:12.5px;}
.oauth-divider::before,.oauth-divider::after{content:""; flex:1; height:1px; background:var(--c-border);}
.oauth-row{display:flex; flex-direction:column; gap:10px;}
.btn-oauth{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--c-border); background:var(--c-surface); color:var(--c-text); font-weight:800; font-size:14.5px; cursor:pointer;}
.btn-oauth:hover{border-color:var(--c-primary);}
.btn-oauth svg{width:19px;height:19px;flex-shrink:0;}
.otp-boxes{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;direction:ltr;margin:18px 0 6px;}
.otp-box{width:38px;height:48px;text-align:center;font-size:20px;font-weight:900;border:1.5px solid var(--c-border);border-radius:10px;background:var(--c-bg);color:var(--c-text);}
.otp-box:focus{outline:none;border-color:var(--c-primary);}
.otp-box.otp-err{border-color:var(--c-danger);}
.otp-countdown{text-align:center;font-size:13px;color:var(--c-text-muted);margin-top:4px;}
.otp-resend-link{color:var(--c-primary);font-weight:800;cursor:pointer;}

/* =========================================================

function toast(msg, type='info'){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);

}
function friendlyError(err){
  const m = (err && err.message) ? err.message : String(err||'حدث خطأ غير متوقع');
  const code = err && err.code;
  if(code==='email_not_confirmed' || /Email not confirmed|email.*not.*confirmed/i.test(m)) return 'البريد الإلكتروني غير مؤكد. أرسلنا لك كود تأكيد.';
  if(code==='invalid_credentials' || /Invalid login credentials/i.test(m)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(code==='user_already_exists' || /already registered|user already registered/i.test(m)) return 'هذا البريد الإلكتروني مسجل بالفعل.';
  if(/Password should be at least|password.*(short|characters|length)|weak password/i.test(m)) return 'كلمة المرور قصيرة أو ضعيفة. استخدم كلمة مرور من 6 أحرف على الأقل.';
  if(code==='otp_expired' || /Token has expired or is invalid/i.test(m)) return 'الكود غير صحيح أو منتهي الصلاحية. اطلب كودًا جديدًا وحاول مجددًا.';
  if(code==='over_email_send_rate_limit' || /security purposes|only request this after|rate limit/i.test(m)) return 'لقد طلبت الكود عدة مرات. الرجاء الانتظار قليلًا قبل إعادة المحاولة.';
  if(/Signups not allowed|signup is disabled/i.test(m)) return 'التسجيل غير متاح حاليًا.';
  if(/permission denied for function/i.test(m)) return 'تعذر الوصول إلى هذه الوظيفة بسبب صلاحيات قاعدة البيانات. لم يتم تجاوز الحماية.';
  if(/Complete your profile before searching/i.test(m)) return 'أكمل ملفك الشخصي أولًا لتتمكن من استخدام البحث الكامل. يمكنك تصفح الملفات العامة في هذه الأثناء.';
  if(/Account not eligible to search/i.test(m)) return 'حسابك غير مؤهل لاستخدام البحث حاليًا (الحساب موقوف أو غير نشط).';
  if(/chk_pref_age/i.test(m)) return 'العمر المدخل يجب أن يكون بين 18 و100 سنة، والحد الأدنى لا يتجاوز الحد الأقصى.';
  if(/chk_pref_height/i.test(m)) return 'الطول المدخل يجب أن يكون بين 100 و250 سم، والحد الأدنى لا يتجاوز الحد الأقصى.';
  if(/chk_pref_weight/i.test(m)) return 'الوزن المدخل يجب أن يكون بين 30 و300 كجم، والحد الأدنى لا يتجاوز الحد الأقصى.';

  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'تعذر الاتصال بالخادم، تحقق من اتصال الإنترنت.';
  return 'تعذر تنفيذ العملية الآن. حاول مرة أخرى.';
}
function openModal(innerHtml, onMount){

  document.getElementById('modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='modal-backdrop') closeModal(); });
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmModal(title, msg, confirmLabel, onConfirm, danger){

    </div>
  `, (root)=>{
    root.querySelector('#cm-cancel').onclick = closeModal;
    root.querySelector('#cm-ok').onclick = async ()=>{ closeModal(); await onConfirm(); };
  });
}

/* =========================================================
   6. API / RPC LAYER
========================================================= */
const api = {
  async rpc(name, args){ const {data,error} = await sb.rpc(name, args||{}); if(error) throw error; return data; },
  getProfileCompletion(){ return this.rpc('get_profile_completion_status'); },
  getPrefsCompletion(){ return this.rpc('get_preferences_completion_status'); },

/* =========================================================
   4. AUTH
========================================================= */
// signUp() intentionally has NO emailRedirectTo / redirect options: we never want Supabase's
// confirmation-link flow to be the mechanism the user relies on. With "Confirm email" ON in the
// project's Auth settings, Supabase creates the account as unconfirmed and — as long as the Confirm
// signup email template contains {{ .Token }} — sends a 6-digit numeric code to that same address.
async function doSignUp(email, password){
  const {data, error} = await sb.auth.signUp({ email, password });
  if(error) throw error;
  return data;
}
// Verifies the code the user typed in (length = OTP_LENGTH). type:'email' is the current (non-deprecated) OTP type
// for both signup and sign-in confirmation in supabase-js v2 ('signup' is accepted but deprecated).
// On success this returns a real session — no separate sign-in call is needed afterwards.
async function verifyEmailOtp(email, token){
  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if(error) throw error;
  return data;
}
// Resends the signup OTP. type:'signup' is resend()'s own (separate) type enum — distinct from
// verifyOtp's type:'email' above. No emailRedirectTo here either.
async function resendSignupOtp(email){
  const {data, error} = await sb.auth.resend({ type: 'signup', email });
  if(error) throw error;
  return data;
}
async function doSignIn(email, password){
  const {data, error} = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return data;
}

/* ---- Forgot / Reset password (Recovery OTP — no link, same philosophy as signup OTP) ---- */
// resetPasswordForEmail() triggers Supabase's "Reset Password" email template (a template SEPARATE
// from "Confirm signup"). No redirectTo is passed, for the same reason signUp() has none: we never
// want the clicked-link flow. As long as that template contains {{ .Token }}, this sends a numeric
// code. Like signUp(), GoTrue does not reveal whether the email exists (anti-enumeration) — it
// resolves the same way either way, so the caller must always show a neutral message.
async function sendRecoveryOtp(email){
  const {data, error} = await sb.auth.resetPasswordForEmail(email);
  if(error) throw error;
  return data;
}
// type:'recovery' is the documented verifyOtp type for a password-reset code — distinct from the
// type:'email' used for signup/login confirmation above. Success returns a session that is already
// active on this client (supabase-js persists it internally), which updateUser() below relies on.
async function verifyRecoveryOtp(email, token){
  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'recovery' });
  if(error) throw error;
  return data;
}
// resend() has no 'recovery' type in its enum (only 'signup'|'email_change'|'sms'|'phone_change'),
// so — per Supabase's own docs — a recovery code is "resent" by calling resetPasswordForEmail()
// again, not by calling resend(). Reusing resendSignupOtp() here would silently call the wrong
// endpoint, so this is a separate function.
async function resendRecoveryOtp(email){ return sendRecoveryOtp(email); }
async function updatePassword(newPassword){
  const {data, error} = await sb.auth.updateUser({ password: newPassword });
  if(error) throw error;
  return data;
}
// OAuth (Google). This only works once the provider is actually enabled with real
// Client ID/Secret in Supabase Dashboard → Authentication → Providers; until then Supabase itself
// returns an error (e.g. "Unsupported provider") which friendlyError() will surface as-is.
async function signInWithOAuth(provider){
  const {data, error} = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: getAuthRedirectUrl() }
  });
  if(error) throw error;
  return data; // contains {url}; supabase-js redirects the browser itself
}

/* ---- OTP resend cooldown (client-side anti-spam; server also rate-limits) ---- */
// Single source of truth for the code length. Supabase is currently sending 8-digit codes to
// this project's Confirm-signup emails (confirmed against a real inbox), so every place that
// builds input boxes, validates length, or slices pasted text reads from this constant instead
// of assuming 6. If the project's OTP length ever changes again, only this line needs editing.
const OTP_LENGTH = 8;
const OTP_COOLDOWN_SECONDS = 60;
function otpCooldownKey(email){ return 'mawadda_otp_cd_' + email.trim().toLowerCase(); }
function setOtpCooldown(email, seconds){
  try{ localStorage.setItem(otpCooldownKey(email), String(Date.now() + (seconds||OTP_COOLDOWN_SECONDS)*1000)); }catch(e){}
}
function getOtpCooldownRemaining(email){
  try{
    const until = parseInt(localStorage.getItem(otpCooldownKey(email))||'0',10);
    return Math.max(0, Math.ceil((until - Date.now())/1000));
  }catch(e){ return 0; }
}
function clearOtpCooldown(email){ try{ localStorage.removeItem(otpCooldownKey(email)); }catch(e){} }
// Starts (or resumes, after a refresh) the OTP-entry screen for an email.
function startOtpFlow(email, purpose){
  S.otp = { email, purpose };
  navigate('/verify-otp');
}
async function doSignOut(){
  await sb.auth.signOut();
  Object.assign(S, {session:null, account:null, profile:null, profileStatus:null, prefStatus:null, isAdmin:false, adminPerms:{}});
  navigate('/');
}

async function loadAccountContext(){
  if(!S.session){ return; }
  const uid = S.session.user.id;
  const {data: acc, error: accErr} = await sb.from('user_accounts').select('*').eq('id', uid).maybeSingle();
  if(accErr){ toast(friendlyError(accErr),'error'); return; }
  S.account = acc;
  try{
    S.profileStatus = await api.getProfileCompletion();
    S.prefStatus = await api.getPrefsCompletion();
  }catch(e){ /* not fatal on first login before profile exists */ }
  try{
    S.isAdmin = await api.isAdmin();
    if(S.isAdmin){
      const [rv, rr, am] = await Promise.all([api.hasPerm('requests.view'), api.hasPerm('requests.review'), api.hasPerm('admins.manage')]);
      S.adminPerms = {'requests.view':rv, 'requests.review':rr, 'admins.manage':am};
    }
  }catch(e){ S.isAdmin=false; }
}

async function ensureGeo(){
  if(S.governorates.length) return;
  const {data, error} = await sb.from('geo_governorates').select('*').eq('is_active',true).order('sort_order');
  if(!error) S.governorates = data||[];
}

const PUBLIC_ROUTES = ['/','/login','/register','/discovery','/verify-otp','/forgot-password','/reset-password'];
const PUBLIC_PREFIXES = ['/candidate/'];
function currentHash(){ return location.hash.replace(/^#/,'') || '/'; }
function navigate(path){ location.hash = path; }
window.addEventListener('hashchange', ()=>render());

async function render(){
  const full = currentHash();
  const [path, qs] = full.split('?');
  S.route = path.split('/').slice(0,2).join('/') || '/';
  const parts = path.split('/').filter(Boolean);
  S.params = {};
  if(parts[0]==='candidate') S.params.id = parts[1];

  const loggedIn = !!S.session;
  if(!loggedIn && !PUBLIC_ROUTES.includes(path) && !PUBLIC_PREFIXES.some(p=>path.startsWith(p))){ navigate('/login'); return; }
  if(loggedIn && ['/login','/register','/verify-otp'].includes(path)){ navigate('/dashboard'); return; }

  document.getElementById('site-header').style.display = loggedIn ? 'block':'block';
  renderHeader();
  renderSidebar();
  renderBottomNav();

  const app = document.getElementById('app');
  window.scrollTo(0,0);

  const routeKey = parts[0] || 'landing';
  try{
    switch(routeKey){
      case '': case 'landing': app.innerHTML = loggedIn ? loadingBox() : viewLanding(); if(loggedIn) navigate('/dashboard'); break;
      case 'login': app.innerHTML = viewLogin(); mountAuthForm('login'); break;
      case 'register': app.innerHTML = viewRegister(); mountAuthForm('register'); break;
      case 'verify-otp':
        if(!S.otp || !S.otp.email){ navigate('/login'); return; }
        app.innerHTML = viewVerifyOtp(); mountVerifyOtp(); break;
      case 'forgot-password': app.innerHTML = viewForgotPassword(); mountForgotPassword(); break;
      case 'reset-password':
        if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
        app.innerHTML = viewResetPassword(); mountResetPassword(); break;
      case 'dashboard': await mountDashboard(app); break;
      case 'profile': await mountProfile(app); break;
      case 'preferences': await mountPreferences(app); break;
      case 'discovery': await mountDiscovery(app); break;
      case 'candidate': await mountCandidate(app, S.params.id); break;
      case 'matches': await mountMatches(app); break;
      case 'requests': await mountRequests(app); break;
      case 'guardians': await mountGuardians(app); break;
      case 'admin': await mountAdmin(app); break;
      default: app.innerHTML = emptyBox('🔍','الصفحة غير موجودة','تحقق من الرابط أو عد للرئيسية.');
    }
  }catch(e){
    console.error(e);
    app.innerHTML = errorBox(e);
  }
}

function renderBottomNav(){
  const root = document.getElementById('bottom-nav-root');

function mountForgotPassword(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.getAttribute('data-nav')));
  const btn = document.getElementById('fp-submit');
  btn.onclick = async ()=>{
    const email = document.getElementById('fp-email').value.trim();
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML='';
    if(!email){ errBox.innerHTML = `<p class="field-error">أدخل بريدك الإلكتروني.</p>`; return; }
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try{
      await sendRecoveryOtp(email);
      setOtpCooldown(email);
      // Neutral message regardless of whether the email is actually registered — never confirm
      // or deny account existence here (anti-enumeration), matching Supabase's own behavior.
      toast('إذا كان بريدك الإلكتروني مسجلًا لدينا، سنرسل كودًا رقميًا لإعادة تعيين كلمة المرور.','success');
      startOtpFlow(email, 'password_reset');
    }catch(e){
      errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
    }finally{
      btn.disabled = false; btn.textContent = 'إرسال الكود';
    }
  };
}

function wirePasswordToggle(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if(!input || !btn) return;
  btn.onclick = ()=>{
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁️' : '🙈';
    btn.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
  };
}
function mountOAuthButtons(){
  ['oauth-google'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onclick = async ()=>{
      const errBox = document.getElementById('auth-error');
      el.disabled = true;
      try{
        await signInWithOAuth(el.dataset.provider); // navigates away to the provider on success
      }catch(e){
        el.disabled = false;
        if(errBox) errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
      }
    };
  });
}
function mountAuthForm(mode){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.getAttribute('data-nav')));
  wirePasswordToggle('f-password','f-password-toggle');
  mountOAuthButtons();
  const forgotLink = document.getElementById('f-forgot-link');
  if(forgotLink) forgotLink.onclick = ()=>navigate('/forgot-password');
  const confirmInput = document.getElementById('f-password-confirm');
  const matchMsg = document.getElementById('pw-match-msg');
  if(mode==='register' && confirmInput){
    wirePasswordToggle('f-password-confirm','f-password-confirm-toggle');
    const pwInput = document.getElementById('f-password');
    const checkMatch = ()=>{
      if(!confirmInput.value){ matchMsg.textContent=''; matchMsg.className='pw-match-msg'; return; }
      const ok = pwInput.value === confirmInput.value;
      matchMsg.textContent = ok ? 'كلمتا المرور متطابقتان.' : 'كلمتا المرور غير متطابقتين.';
      matchMsg.className = 'pw-match-msg ' + (ok?'ok':'bad');
    };
    pwInput.addEventListener('input', checkMatch);
    confirmInput.addEventListener('input', checkMatch);
  }
  const btn = document.getElementById('f-submit');
  btn.onclick = async ()=>{
    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value;
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML='';
    if(!email || !password){ errBox.innerHTML = `<p class="field-error">أدخل البريد الإلكتروني وكلمة المرور.</p>`; return; }
    if(mode==='register' && confirmInput && password !== confirmInput.value){
      errBox.innerHTML = `<p class="field-error">كلمتا المرور غير متطابقتين.</p>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'جارٍ التنفيذ…';
    try{
      if(mode==='register'){
        const data = await doSignUp(email, password);
        // Anti-enumeration: if this email is already registered & confirmed, Supabase returns a
        // user object with an EMPTY identities array and sends no email at all. Detect that and
        // send the person to login instead of parking them on an OTP screen that will never fill.
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          errBox.innerHTML = `<p class="field-error">هذا البريد الإلكتروني مسجل بالفعل. جرّب تسجيل الدخول.</p>`;
          return;
        }
        // Confirm Email is ON for this project, so signUp() must not return a live session.
        // Defensive-only: if it ever does (e.g. Confirm Email were switched off), never silently
        // treat that as "confirmed" — only trust an explicit email_confirmed_at.
        if(data.session && data.session.user?.email_confirmed_at){
          await bootAfterAuth(data.session);
          toast('تم إنشاء الحساب وتأكيد البريد.','success');
          navigate('/dashboard');
          return;
        }
        if(data.session){ await sb.auth.signOut(); }
        setOtpCooldown(email); // signUp already triggered the first OTP email
        toast(`تم إنشاء حسابك بنجاح. أرسلنا كود تأكيد مكوّنًا من ${OTP_LENGTH} أرقام إلى بريدك الإلكتروني.`,'success');
        startOtpFlow(email, 'register');
      } else {
        const data = await doSignIn(email, password);
        if(!data.session || !data.session.user?.email_confirmed_at){
          await sb.auth.signOut();
          throw { code:'email_not_confirmed', message:'Email not confirmed' };
        }
        await bootAfterAuth(data.session);
        toast('تم تسجيل الدخول','success');
        navigate('/dashboard');
      }
    }catch(e){
      const isUnconfirmed = (e && e.code==='email_not_confirmed') || /Email not confirmed/i.test((e&&e.message)||'');
      if(mode!=='register' && isUnconfirmed){
        errBox.innerHTML = `<div class="auth-success"><strong>البريد الإلكتروني غير مؤكد.</strong> أرسلنا لك كود تأكيد.<br><button class="btn btn-outline btn-sm" id="f-send-otp-login" style="margin-top:10px;">إرسال كود جديد</button></div>`;
        document.getElementById('f-send-otp-login').onclick = async ()=>{
          try{
            await resendSignupOtp(email);
            setOtpCooldown(email);
            toast('تم إرسال كود جديد إلى بريدك الإلكتروني.','success');
            startOtpFlow(email, 'login');

function mountVerifyOtp(){
  if(!S.otp || !S.otp.email){ navigate('/login'); return; }
  const email = S.otp.email;
  const purpose = S.otp.purpose;
  const boxes = Array.from({length:OTP_LENGTH}, (_,i)=>document.getElementById('otp-'+i));
  const errBox = document.getElementById('otp-error');
  const confirmBtn = document.getElementById('otp-confirm');
  const resendEl = document.getElementById('otp-resend');
  const countdownWrap = document.getElementById('otp-countdown-wrap');

  boxes[0].focus();
  boxes.forEach((box,i)=>{
    box.addEventListener('input', ()=>{
      box.value = box.value.replace(/[^0-9]/g,'').slice(0,1);
      box.classList.remove('otp-err');
      if(box.value && i<OTP_LENGTH-1) boxes[i+1].focus();
    });
    box.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !box.value && i>0){ boxes[i-1].focus(); }
    });
    box.addEventListener('paste', (e)=>{
      const text = (e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
      if(!text) return;
      e.preventDefault();
      text.slice(0,OTP_LENGTH).split('').forEach((ch,idx)=>{ if(boxes[idx]){ boxes[idx].value = ch; } });
      const next = Math.min(text.length,OTP_LENGTH)-1;
      if(boxes[next]) boxes[next].focus();
    });
  });

  function markInvalid(){ boxes.forEach(b=>b.classList.add('otp-err')); }
  function collectCode(){ return boxes.map(b=>b.value).join(''); }

  async function doConfirm(){
    const code = collectCode();
    errBox.innerHTML='';
    if(code.length!==OTP_LENGTH){ errBox.innerHTML = `<p class="field-error">أدخل الكود المكوّن من ${OTP_LENGTH} أرقام كاملًا.</p>`; markInvalid(); return; }
    confirmBtn.disabled = true; confirmBtn.textContent='جارٍ التحقق…';
    try{
      // Same verification screen, different underlying Supabase OTP type per purpose: signup/login
      // confirmation uses type:'email', password recovery uses type:'recovery' (see the two
      // functions' comments above for why they can't be merged into one call).
      const data = purpose==='password_reset' ? await verifyRecoveryOtp(email, code) : await verifyEmailOtp(email, code);
      if(!data.session){ throw new Error('لم يتم إنشاء الجلسة، حاول مرة أخرى.'); }
      clearOtpCooldown(email);
      S.otp = null;
      if(purpose==='password_reset'){
        // Do NOT bootAfterAuth/dashboard here: this session exists only to authorize the next
        // updateUser({password}) call. The reset-password screen itself gates on S.recovery.
        S.recovery = { email };
        toast('تم التحقق من الكود. يمكنك الآن تعيين كلمة مرور جديدة.','success');
        navigate('/reset-password');
      } else {
        await bootAfterAuth(data.session);
        toast('تم تأكيد بريدك الإلكتروني بنجاح.','success');
        // Continue into the app's existing post-auth flow (dashboard nudges profile completion).
        navigate('/dashboard');
      }
    }catch(e){
      errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
      markInvalid();
      boxes.forEach(b=>b.value='');
      boxes[0].focus();
    }finally{
      confirmBtn.disabled = false; confirmBtn.textContent='تأكيد الكود';
    }
  }
  confirmBtn.onclick = doConfirm;

  let timer = null;
  function renderCountdown(){
    const remaining = getOtpCooldownRemaining(email);
    if(remaining<=0){
      resendEl.textContent = 'إعادة إرسال الكود';
      resendEl.classList.remove('disabled');
      resendEl.onclick = doResend;
      if(timer){ clearInterval(timer); timer=null; }
      return;
    }
    const mm = String(Math.floor(remaining/60)).padStart(2,'0');
    const ss = String(remaining%60).padStart(2,'0');
    resendEl.textContent = `إعادة الإرسال بعد ${mm}:${ss}`;
    resendEl.classList.add('disabled');
    resendEl.onclick = null;
  }
  async function doResend(){
    resendEl.classList.add('disabled');
    try{
      // resend() has no 'recovery' type — a recovery code must be re-requested via
      // resetPasswordForEmail() again (resendRecoveryOtp wraps that). See its definition above.
      if(purpose==='password_reset') await resendRecoveryOtp(email); else await resendSignupOtp(email);
      setOtpCooldown(email);
      toast('تم إرسال كود جديد إلى بريدك الإلكتروني.','success');
      boxes.forEach(b=>{ b.value=''; b.classList.remove('otp-err'); });
      boxes[0].focus();
    }catch(e){
      toast(friendlyError(e),'error');
      // If the server itself rate-limited us, keep the button disabled a bit so we don't hammer it.
      if(getOtpCooldownRemaining(email)<=0) setOtpCooldown(email, 30);
    }finally{
      renderCountdown();
    }
  }
  renderCountdown();
  timer = setInterval(renderCountdown, 1000);

  document.getElementById('otp-change-email').onclick = ()=>{
    if(timer){ clearInterval(timer); timer=null; }
    S.otp = null;
    navigate(purpose==='password_reset' ? '/forgot-password' : '/register');
  };
}

function mountResetPassword(){
  if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
  wirePasswordToggle('rp-password','rp-password-toggle');
  wirePasswordToggle('rp-password-confirm','rp-password-confirm-toggle');
  const pw = document.getElementById('rp-password');
  const confirmInput = document.getElementById('rp-password-confirm');
  const matchMsg = document.getElementById('rp-match-msg');
  const checkMatch = ()=>{
    if(!confirmInput.value){ matchMsg.textContent=''; matchMsg.className='pw-match-msg'; return; }
    const ok = pw.value === confirmInput.value;
    matchMsg.textContent = ok ? 'كلمتا المرور متطابقتان.' : 'كلمتا المرور غير متطابقتين.';
    matchMsg.className = 'pw-match-msg ' + (ok?'ok':'bad');
  };
  pw.addEventListener('input', checkMatch);
  confirmInput.addEventListener('input', checkMatch);

  const btn = document.getElementById('rp-submit');
  btn.onclick = async ()=>{
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML='';
    if(!pw.value || pw.value.length<6){ errBox.innerHTML = `<p class="field-error">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</p>`; return; }
    if(pw.value !== confirmInput.value){ errBox.innerHTML = `<p class="field-error">كلمتا المرور غير متطابقتين.</p>`; return; }
    if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
    btn.disabled = true; btn.textContent = 'جارٍ التحديث…';
    try{
      await updatePassword(pw.value);
      S.recovery = null;
      // Force a clean, fresh login with the new password rather than continuing on the
      // short-lived recovery session, per the requested flow (back to /login, not /dashboard).
      await sb.auth.signOut();
      toast('تم تغيير كلمة المرور بنجاح. سجّل الدخول بكلمة المرور الجديدة.','success');
      navigate('/login');
    }catch(e){
      errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
    }finally{
      btn.disabled = false; btn.textContent = 'تغيير كلمة المرور';
    }
  };
}

// Mirrors DB CHECK constraints on user_preferences (chk_pref_age_bounds/range, height, weight)
// so invalid input is caught client-side with a clear message instead of a raw 400 from Postgres.
function validatePrefRanges(){
  const checks = [
    {min:'pr-min_age', max:'pr-max_age', lo:18, hi:100, label:'العمر'},
    {min:'pr-min_height_cm', max:'pr-max_height_cm', lo:100, hi:250, label:'الطول'},
    {min:'pr-min_weight_kg', max:'pr-max_weight_kg', lo:30, hi:300, label:'الوزن'}
  ];
  for(const c of checks){
    const minV = numOrNull(c.min), maxV = numOrNull(c.max);
    if(minV!==null && (minV<c.lo || minV>c.hi)) return `الحد الأدنى لـ${c.label} يجب أن يكون بين ${c.lo} و${c.hi}.`;
    if(maxV!==null && (maxV<c.lo || maxV>c.hi)) return `الحد الأقصى لـ${c.label} يجب أن يكون بين ${c.lo} و${c.hi}.`;
    if(minV!==null && maxV!==null && minV>maxV) return `الحد الأدنى لـ${c.label} لا يمكن أن يكون أكبر من الحد الأقصى.`;
  }
  return null;
}
function multiChips(group, currentArr){
  const cur = new Set(currentArr||[]);
  return Object.entries(LABELS[group]).map(([v,t])=>`<span class="chip chip-select ${cur.has(v)?'on':''}" data-v="${v}">${t}</span>`).join('');
}
function chipsOn(containerId){ return [...document.getElementById(containerId).querySelectorAll('.chip-select.on')].map(c=>c.dataset.v); }

let discoveryOffset = 0;
const DISCOVERY_LIMIT = 12;
async function mountDiscovery(app){
  await ensureGeo();
  app.innerHTML = `
  <div class="container">
    <h2>استكشاف المرشحين</h2>
    <div class="card card-tight">

      <label>الحالة الاجتماعية</label><div id="df-marital">${multiChips('marital_status',[])}</div>
      <button class="btn btn-primary btn-sm" id="df-apply" style="margin-top:14px;">تطبيق الفلاتر</button>
    </div>
    <div id="disc-results" style="margin-top:18px;">${loadingBox('جارِ البحث عن مرشحين…')}</div>
  </div>`;
  document.querySelectorAll('#df-marital .chip-select').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('df-apply').onclick = ()=>{ discoveryOffset=0; runDiscovery(); };
  discoveryOffset = 0;
  runDiscovery();
}
async function runDiscovery(){
  const box = document.getElementById('disc-results');
  box.innerHTML = loadingBox('جارِ البحث…');
  const filters = {
    p_limit: DISCOVERY_LIMIT, p_offset: discoveryOffset,
    p_min_age: numOrNull('df-min_age'), p_max_age: numOrNull('df-max_age'),
    p_governorate_id: numOrNull('df-gov'),
    p_marital_statuses: chipsOn('df-marital').length? chipsOn('df-marital') : null
  };
  // Anonymous visitors: safe public RPC (no phone/email/sensitive fields, no auth required).
  // Logged-in members: richer private search RPC (more filters, requires a completed profile).
  let usedPublicFallback = false;
  try{
    let res;
    if(S.session){
      try{ res = await api.getCandidateProfiles(filters); }
      catch(privateErr){
        const pm = (privateErr&&privateErr.message)||'';
        // Profile not complete yet / account not eligible: don't block browsing — fall back to public view.
        if(/Complete your profile|not eligible/i.test(pm)){ res = await api.getPublicCandidateProfiles(filters); usedPublicFallback = true; }
        else throw privateErr;
      }
    } else {
      res = await api.getPublicCandidateProfiles(filters);
    }
    const fallbackBanner = usedPublicFallback ? `<div class="state-box" style="margin-bottom:10px;padding:10px 14px;"><p class="muted" style="margin:0;">أكمل ملفك الشخصي لرؤية نتائج بحث أدق ومطابقة لتفضيلاتك. حاليًا تشاهد الملفات العامة فقط. <a style="color:var(--c-primary);font-weight:800;cursor:pointer;" data-nav="/profile">إكمال الملف</a></p></div>` : '';
    if(!res.items || !res.items.length){
      box.innerHTML = fallbackBanner + emptyBox('🔍','لا توجد نتائج مطابقة','جرّب تعديل الفلاتر أو إكمال ملفك الشخصي وتفضيلاتك أولًا.');
      return;
    }
    box.innerHTML = fallbackBanner + `<div class="grid grid-3">${res.items.map(candCard).join('')}</div>
      <div class="flex" style="justify-content:center; gap:10px; margin-top:20px;">
        <button class="btn btn-outline btn-sm" id="disc-prev" ${discoveryOffset===0?'disabled':''}>السابق</button>
        <span class="muted">${discoveryOffset+1}–${discoveryOffset+res.returned_count} من ${res.total_count}</span>
        <button class="btn btn-outline btn-sm" id="disc-next" ${!res.has_more?'disabled':''}>التالي</button>
      </div>`;
    box.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));
    box.querySelectorAll('[data-cand]').forEach(el=>el.onclick=()=>navigate('/candidate/'+el.dataset.cand));
    const prev = document.getElementById('disc-prev'); if(prev) prev.onclick=()=>{ discoveryOffset=Math.max(0,discoveryOffset-DISCOVERY_LIMIT); runDiscovery(); };
    const next = document.getElementById('disc-next'); if(next) next.onclick=()=>{ discoveryOffset+=DISCOVERY_LIMIT; runDiscovery(); };
  }catch(e){ box.innerHTML = errorBox(e); }
}

async function renderSentRequests(panel){
  const {data, error} = await sb.from('marriage_requests').select('*').eq('sender_id', S.session.user.id).order('created_at',{ascending:false});
  if(error) throw error;
  if(!data.length){ panel.innerHTML = emptyBox('✉️','لم ترسل أي طلبات بعد','توجّه لصفحة الاستكشاف لإرسال طلب تعارف.'); return; }
  const {data: reviews} = await sb.from('marriage_request_reviews').select('*').in('request_id', data.map(r=>r.id));
  const reviewMap = Object.fromEntries((reviews||[]).map(r=>[r.request_id, r]));
  panel.innerHTML = data.map(r=>{
    const rev = reviewMap[r.id];
    return `<div class="card card-tight" style="margin-bottom:10px;">
      <div class="flex-between">
        <span class="badge ${statusBadgeClass(r.status)}">${L('request_status',r.status)}</span>

        <button class="btn btn-outline btn-sm" data-view="${r.recipient_id}">عرض الملف</button>
        ${r.status==='pending'?`<button class="btn btn-danger btn-sm" data-withdraw="${r.id}">سحب الطلب</button>`:''}
      </div>
    </div>`;
  }).join('');
  panel.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate('/candidate/'+b.dataset.view));
  panel.querySelectorAll('[data-withdraw]').forEach(b=>b.onclick=()=>{
    confirmModal('سحب الطلب','هل أنت متأكد من سحب طلب الزواج هذا؟','سحب', async ()=>{
      try{
        const {error} = await sb.from('marriage_requests').update({status:'withdrawn'}).eq('id', b.dataset.withdraw);

        toast('تم سحب الطلب','success');

      </div>`).join('');
    list.querySelectorAll('.am-revoke-btn').forEach(b=>b.onclick=()=>{
      confirmModal('إزالة دور إداري', `هل تريد إزالة الدور <strong>${b.dataset.code}</strong> من <strong>${b.dataset.member}</strong>؟`, 'إزالة', async ()=>{
        try{ await api.adminRevokeRole(b.dataset.uid, b.dataset.code); toast('تمت الإزالة','success'); await renderAdminsList(); }
        catch(e){ toast(friendlyError(e),'error'); }
      }, true);
    });
  }catch(e){ list.innerHTML = errorBox(e); }
}

async function renderAdminRequests(){
  const list = document.getElementById('admin-req-list');
  if(!S.adminPerms['requests.view'] && !S.adminPerms['requests.review']){
    list.innerHTML = emptyBox('🔒','لا تملك صلاحية','تحتاج صلاحية requests.view أو requests.review لعرض هذا القسم.');
    return;
  }
  try{
    const {data: reviews, error} = await sb.from('marriage_request_reviews').select('*').eq('decision','pending').order('created_at');
    if(error) throw error;
    if(!reviews.length){ list.innerHTML = emptyBox('✅','لا توجد طلبات بانتظار المراجعة','كل الطلبات تمت مراجعتها حتى الآن.'); return; }
    const {data: reqs, error:e2} = await sb.from('marriage_requests').select('*').in('id', reviews.map(r=>r.request_id));
    if(e2) throw e2;
    const reqMap = Object.fromEntries(reqs.map(r=>[r.id,r]));
    list.innerHTML = reviews.map(rv=>{
      const r = reqMap[rv.request_id]; if(!r) return '';
      return `<div class="card card-tight" style="margin-bottom:10px;">
        <p class="mb0"><strong>رقم الطلب:</strong> <span class="muted">${r.id}</span></p>
        <p class="mb0"><strong>المرسل (UUID):</strong> <span class="muted">${r.sender_id}</span></p>
        <p class="mb0"><strong>المستقبل (UUID):</strong> <span class="muted">${r.recipient_id}</span></p>
        <p class="mb0"><strong>تاريخ الإرسال:</strong> ${new Date(r.created_at).toLocaleString('ar-EG')}</p>
        ${S.adminPerms['requests.review']? `
        <div class="flex gap8" style="margin-top:10px;">
          <button class="btn btn-success btn-sm" data-approve="${r.id}">اعتماد</button>
          <button class="btn btn-danger btn-sm" data-reject="${r.id}">رفض</button>
        </div>` : `<p class="hint">تملك صلاحية العرض فقط، وليس المراجعة.</p>`}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{
      confirmModal('اعتماد الطلب','هل تعتمد هذا الطلب لإرساله للطرف المستقبل؟','اعتماد', async ()=>{
        try{ await api.adminReview(b.dataset.approve,'approved'); toast('تم الاعتماد','success'); renderAdminRequests(); }
        catch(e){ toast(friendlyError(e),'error'); }
      });
    });
    list.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{
      openModal(`<h3>سبب الرفض</h3><textarea id="rej-reason" placeholder="اذكر سبب الرفض (اختياري)"></textarea>
        <div class="flex gap8" style="justify-content:flex-end; margin-top:14px;">
          <button class="btn btn-ghost" id="rej-cancel">إلغاء</button><button class="btn btn-danger" id="rej-ok">تأكيد الرفض</button>
        </div>`, (root)=>{
        root.querySelector('#rej-cancel').onclick = closeModal;
        root.querySelector('#rej-ok').onclick = async ()=>{
          const reason = document.getElementById('rej-reason').value.trim();
          closeModal();
          try{ await api.adminReview(b.dataset.reject,'rejected',reason||null); toast('تم الرفض','success'); renderAdminRequests(); }
          catch(e){ toast(friendlyError(e),'error'); }
        };
      });
    });
  }catch(e){ list.innerHTML = errorBox(e); }
}

/* =========================================================
   18. INITIALIZATION — session bootstrap, avoids infinite loading
========================================================= */
async function bootAfterAuth(session){
  S.session = session;
  await loadAccountContext();
}
let authListenerFired = false;
sb.auth.onAuthStateChange(async (event, session)=>{
  if(event==='SIGNED_OUT'){
    Object.assign(S, {session:null, account:null, profile:null, profileStatus:null, prefStatus:null, isAdmin:false, adminPerms:{}});
    if(S.booted) render();
    return;
  }
  if(session){
    S.session = session;
    if(S.booted){ await loadAccountContext(); render(); }
  }
});

(async function init(){
  initTheme();
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session){ await bootAfterAuth(session); }
  }catch(e){ console.error(e); }
  finally{
    S.booted = true;
    render();
  }
})();
// safety net: never leave the user stuck on nothing
setTimeout(()=>{ if(!S.booted){ S.booted = true; render(); } }, 6000);
</script>
