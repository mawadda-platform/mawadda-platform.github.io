<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مودة | منصة الزواج الجاد</title>
<script>
/* Runs before first paint: sets the theme with no flash, honoring a saved choice
   first and the OS-level prefers-color-scheme otherwise. */
(function(){
  try{
    var saved = localStorage.getItem('mawadda-theme');
    var t = (saved==='dark'||saved==='light') ? saved
      : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --c-bg:#faf7f2; --c-surface:#ffffff; --c-surface-2:#f3ede3;
  --c-primary:#7a4a3a; --c-primary-dark:#5c362a; --c-primary-light:#a9705b;
  --c-accent:#b08d57; --c-accent-light:#e7d9bd;
  --c-text:#2c2420; --c-text-muted:#7a6f66; --c-border:#e6ddd0;
  --c-success:#3f7d5c; --c-success-bg:#e5f3ec;
  --c-warn:#a97514; --c-warn-bg:#fbf1de;
  --c-danger:#a33b3b; --c-danger-bg:#fbe9e9;
  --c-info:#3a6ea5; --c-info-bg:#e8f1fb;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 10px rgba(60,40,25,0.08);
  --shadow-lg:0 10px 30px rgba(60,40,25,0.14);
  --maxw:1080px;
  --header-h:64px; --bottomnav-h:64px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px));}
body{
  margin:0; font-family:'Tajawal',system-ui,sans-serif; background:var(--c-bg); color:var(--c-text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{margin:0 0 8px; font-weight:900; line-height:1.3;}
p{line-height:1.8; color:var(--c-text-muted); margin:0 0 10px;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px;}

/* Header */
.header{
  position:sticky; top:0; z-index:40; background:rgba(250,247,242,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--c-border); padding-top:env(safe-area-inset-top,0px);
}
.header-inner{max-width:var(--maxw); margin:0 auto; height:var(--header-h); display:flex; align-items:center; justify-content:space-between; padding:0 16px;}
.brand{display:flex; align-items:center; gap:8px; font-weight:900; font-size:22px; color:var(--c-primary); cursor:pointer;}
.brand .dot{color:var(--c-accent);}
.header-actions{display:flex; align-items:center; gap:10px;}
.nav-desktop{display:none; gap:4px;}
@media(min-width:860px){ .nav-desktop{display:flex;} }
.nav-link{padding:9px 14px; border-radius:99px; font-weight:700; font-size:14px; cursor:pointer; color:var(--c-text-muted); white-space:nowrap;}
.nav-link.active{background:var(--c-primary); color:#fff;}
.nav-link:hover:not(.active){background:var(--c-surface-2);}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:99px; padding:11px 22px; font-weight:700; font-size:15px; cursor:pointer; transition:.15s; white-space:nowrap;}
.btn-primary{background:var(--c-primary); color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:transparent; color:var(--c-primary); border:1.5px solid var(--c-primary);}
.btn-outline:hover{background:var(--c-surface-2);}
.btn-ghost{background:transparent; color:var(--c-text-muted);}
.btn-ghost:hover{background:var(--c-surface-2);}
.btn-danger{background:var(--c-danger); color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-success{background:var(--c-success); color:#fff;}
.btn-sm{padding:7px 14px; font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Layout */
.container{max-width:var(--maxw); margin:0 auto; padding:24px 16px 48px;}
.container.narrow{max-width:520px;}
.grid{display:grid; gap:16px;}
@media(min-width:700px){ .grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} }

/* Cards */
.card{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.card-tight{padding:14px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h3{margin:0;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700;}
.badge-success{background:var(--c-success-bg); color:var(--c-success);}
.badge-warn{background:var(--c-warn-bg); color:var(--c-warn);}
.badge-danger{background:var(--c-danger-bg); color:var(--c-danger);}
.badge-info{background:var(--c-info-bg); color:var(--c-info);}
.badge-muted{background:var(--c-surface-2); color:var(--c-text-muted);}
.chip{display:inline-block; padding:4px 12px; border-radius:99px; background:var(--c-surface-2); color:var(--c-text); font-size:13px; font-weight:500; margin:2px;}
.chip-select{cursor:pointer; border:1.5px solid var(--c-border); background:var(--c-surface);}
.chip-select.on{background:var(--c-primary); border-color:var(--c-primary); color:#fff;}

/* Forms */
label{display:block; font-weight:700; font-size:13px; margin:14px 0 5px; color:var(--c-text);}
label:first-child{margin-top:0;}
.hint{font-size:12px; color:var(--c-text-muted); margin-top:4px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--c-border);
  background:var(--c-surface); font-family:inherit; font-size:15px; color:var(--c-text);
}
textarea{resize:vertical; min-height:90px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--c-primary);}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field-error{color:var(--c-danger); font-size:12.5px; margin-top:4px;}
fieldset{border:1px solid var(--c-border); border-radius:var(--radius-sm); padding:12px 14px; margin:14px 0 0;}
legend{font-weight:700; font-size:13px; padding:0 6px;}

/* Progress */
.progress{height:9px; background:var(--c-surface-2); border-radius:99px; overflow:hidden;}
.progress > div{height:100%; background:linear-gradient(90deg,var(--c-accent),var(--c-primary)); border-radius:99px; transition:width .3s;}

/* Toast */
#toast-container{position:fixed; top:calc(var(--header-h) + 12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:min(92vw,380px);}
.toast{padding:12px 16px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); font-size:14px; font-weight:600; color:#fff; animation:slidein .2s ease;}
.toast-success{background:var(--c-success);} .toast-error{background:var(--c-danger);} .toast-info{background:var(--c-primary);}
@keyframes slidein{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(30,20,15,0.5); z-index:150; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:640px){ .modal-backdrop{align-items:center;} }
.modal{background:var(--c-surface); border-radius:18px 18px 0 0; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow-lg);}
@media(min-width:640px){ .modal{border-radius:var(--radius);} }

/* Empty / loading / error states */
.state-box{text-align:center; padding:40px 20px; color:var(--c-text-muted);}
/* Platform notice — homepage card + shared modal styling */
.notice-card{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:24px 22px 22px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.notice-card::before{content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--c-accent);}
.notice-card-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.notice-card-head h3{margin:0; font-size:17px;}
.notice-pin{font-size:19px; line-height:1;}
.notice-card-body{font-size:14.5px; line-height:2; color:var(--c-text);}
.notice-card-body p, .notice-modal-body p{margin:0 0 12px;}
.notice-card-body p:last-child, .notice-modal-body p:last-child{margin-bottom:0;}
.notice-quote{font-weight:800; color:var(--c-primary-dark);}
.notice-strong{font-weight:800; color:var(--c-primary-dark);}
.notice-modal{position:relative;}
.notice-modal-close{position:absolute; top:0; inset-inline-end:0; background:none; border:none; font-size:16px; color:var(--c-text-muted); cursor:pointer; padding:4px 6px; line-height:1;}
.notice-modal-head{display:flex; align-items:center; gap:10px; margin:0 26px 8px 0;}
.notice-modal-head h3{margin:0; font-size:16.5px;}
.notice-modal-sub{margin:0 0 12px; font-size:13.5px; color:var(--c-text-muted);}
.notice-modal-body{max-height:42vh; overflow-y:auto; font-size:14px; line-height:1.95; background:var(--c-surface-2); border:1px solid var(--c-border); border-radius:12px; padding:14px; margin-bottom:14px;}
.notice-check-row{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; line-height:1.7; margin-bottom:14px; cursor:pointer; color:var(--c-text);}
.notice-check-row input[type=checkbox]{width:19px; height:19px; flex-shrink:0; margin-top:2px; accent-color:var(--c-primary); cursor:pointer;}
.state-box .icon{font-size:40px; margin-bottom:10px;}
.spinner{width:34px; height:34px; border:3px solid var(--c-surface-2); border-top-color:var(--c-primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--c-surface-2) 25%,#eee5d7 37%,var(--c-surface-2) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-sm); height:80px;}
@keyframes sk{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}

/* Bottom nav (mobile) */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--c-surface); border-top:1px solid var(--c-border);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);}
@media(min-width:860px){ .bottom-nav{display:none;} }
.bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 2px; font-size:11px; font-weight:700; color:var(--c-text-muted); cursor:pointer;}
.bn-item.active{color:var(--c-primary);}
.bn-icon{font-size:19px;}
body.has-bottomnav .container{padding-bottom:calc(var(--bottomnav-h) + 24px);}

/* Hero */
.hero{padding:48px 0 32px; text-align:center;}
.hero h1{font-size:clamp(28px,5vw,44px); color:var(--c-primary-dark);}
.hero p.lead{font-size:17px; max-width:560px; margin:0 auto 22px;}
.hero-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.feature-list{display:grid; gap:14px; margin-top:30px;}
@media(min-width:700px){ .feature-list{grid-template-columns:repeat(3,1fr);} }
.feature-item{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:18px; text-align:center;}
.feature-item .emoji{font-size:30px; margin-bottom:8px;}
.steps{counter-reset:step; display:grid; gap:14px; margin-top:14px;}
.step{display:flex; gap:14px; align-items:flex-start; background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:16px;}
.step-num{flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--c-primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900;}

/* candidate card */
.cand-card{background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:.15s;}
.cand-card:hover{box-shadow:var(--shadow-lg); border-color:var(--c-accent);}
.cand-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.cand-age{font-weight:900; font-size:20px; color:var(--c-primary-dark);}

/* misc */
.muted{color:var(--c-text-muted);}
.center{text-align:center;}
.mt0{margin-top:0;} .mb0{margin-bottom:0;}
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.gap8{gap:8px;} .gap12{gap:12px;}
.tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--c-border); margin-bottom:16px; overflow-x:auto;}
.tab{padding:10px 16px; font-weight:700; color:var(--c-text-muted); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;}
.tab.active{color:var(--c-primary); border-color:var(--c-primary);}
.hr{border:none; border-top:1px solid var(--c-border); margin:16px 0;}
.coming-soon{opacity:.55; position:relative;}
.list-empty-illustration{font-size:44px;}

/* =========================================================
   MAWADDA REDESIGN — v3
========================================================= */
:root{
  --c-bg:#f6f7f9; --c-surface:#ffffff; --c-surface-2:#f0f2f5;
  --c-primary:#274c45; --c-primary-dark:#19372f; --c-primary-light:#4f786e;
  --c-accent:#b9975b; --c-accent-light:#eee4d0;
  --c-text:#1f2926; --c-text-muted:#6d7773; --c-border:#dde3e0;
  --c-success:#2f7657; --c-success-bg:#e7f4ed;
  --c-warn:#a06c16; --c-warn-bg:#fbf2df;
  --c-danger:#a34343; --c-danger-bg:#f9e9e9;
  --c-info:#3c678a; --c-info-bg:#e8f1f8;
  --radius:18px; --radius-sm:12px;
  --shadow:0 4px 18px rgba(25,45,39,.06);
  --shadow-lg:0 18px 45px rgba(25,45,39,.12);
  --maxw:1180px; --sidebar-w:248px;
}
html[data-theme="dark"]{
  --c-bg:#111816; --c-surface:#18211e; --c-surface-2:#202b27;
  --c-primary:#8fb8ad; --c-primary-dark:#b8d2ca; --c-primary-light:#6e9d91;
  --c-accent:#d1b276; --c-accent-light:#3a3327;
  --c-text:#edf3f0; --c-text-muted:#aab8b3; --c-border:#2d3935;
  --c-success:#74b894; --c-success-bg:#173126;
  --c-warn:#e0b86d; --c-warn-bg:#352a18;
  --c-danger:#df8585; --c-danger-bg:#351e20;
  --c-info:#8eb8dc; --c-info-bg:#1d2c38;
  --shadow:0 4px 20px rgba(0,0,0,.18); --shadow-lg:0 20px 50px rgba(0,0,0,.32);
}
html[data-theme="dark"] .header{background:rgba(17,24,22,.88);}
html[data-theme="dark"] .btn-primary{color:#10201b;}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color-scheme:dark;}
html[data-theme="dark"] .skeleton{background:linear-gradient(90deg,#202b27 25%,#2a3732 37%,#202b27 63%);}

body{background:var(--c-bg); color:var(--c-text);}
.header{height:68px; background:color-mix(in srgb,var(--c-bg) 92%,transparent); border-bottom-color:var(--c-border);}
.header-inner{height:68px; max-width:1280px;}
.brand{font-size:24px; letter-spacing:-.4px;}
.brand:before{content:""; width:10px; height:10px; border-radius:50%; background:var(--c-accent); display:inline-block; margin-inline-end:2px;}
.nav-desktop{display:none!important;}
.header-actions{gap:8px;}
.header-actions .badge{max-width:130px; overflow:hidden; text-overflow:ellipsis;}
.container{max-width:1180px; padding:34px 22px 70px;}
.container.narrow{max-width:620px;}
.card{border-radius:18px; box-shadow:var(--shadow); border-color:var(--c-border);}
.btn{min-height:42px; border-radius:12px; padding:10px 17px;}
.btn-primary{background:var(--c-primary);}
.btn-outline{border-color:var(--c-border); background:var(--c-surface); color:var(--c-text);}
.btn-outline:hover{border-color:var(--c-primary); color:var(--c-primary);}
.btn-danger{background:var(--c-danger);}
.btn-success{background:var(--c-success);}
label{margin-top:18px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{background:var(--c-surface); border-color:var(--c-border); min-height:46px;}
textarea{min-height:110px;}
.section-title{margin:34px 0 14px;}
.progress{height:8px;}
.modal-backdrop{background:rgba(10,18,15,.62); backdrop-filter:blur(4px);}
.modal{background:var(--c-surface); border:1px solid var(--c-border);}

#desktop-sidebar{display:none;}
@media(min-width:860px){
  #desktop-sidebar{
    display:block; position:fixed; top:68px; right:0; bottom:0; width:var(--sidebar-w);
    background:var(--c-surface); border-left:1px solid var(--c-border); z-index:35;
    padding:22px 14px; overflow:auto;
  }
  body:has(#desktop-sidebar:not(:empty)) .header-inner{padding-right:calc(var(--sidebar-w) + 18px);}
  body:has(#desktop-sidebar:not(:empty)) #app{margin-right:var(--sidebar-w);}
  .bottom-nav{display:none!important;}
}
.sidebar-section{margin:10px 0 8px; padding:0 10px; color:var(--c-text-muted); font-size:11px; font-weight:900; letter-spacing:.4px;}
.sidebar-link{display:flex; align-items:center; gap:11px; width:100%; padding:11px 12px; border-radius:12px; color:var(--c-text-muted); font-weight:700; cursor:pointer; margin:2px 0;}
.sidebar-link:hover{background:var(--c-surface-2); color:var(--c-text);}
.sidebar-link.active{background:var(--c-primary); color:#fff;}
.sidebar-icon{width:23px; text-align:center; font-size:17px;}
.sidebar-divider{height:1px;background:var(--c-border);margin:14px 8px;}
.theme-switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--c-border);border-radius:12px;background:var(--c-surface);cursor:pointer;font-weight:700;}
.theme-switch .theme-icon{font-size:18px;}
@media(max-width:859px){
  .header-inner{padding:0 14px;}
  .header-actions .member-code{display:none;}
  .container{padding:24px 14px 92px;}
  .hero{padding:40px 14px 24px;}
}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;}
.page-heading h1,.page-heading h2{margin-bottom:4px;}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--c-primary);font-weight:900;font-size:12px;margin-bottom:7px;}
.eyebrow:before{content:"";width:20px;height:2px;background:var(--c-accent);}
.hero-redesign{position:relative;overflow:hidden;padding:64px 0 42px;}
.hero-redesign:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--c-accent-light);opacity:.35;top:-210px;left:-100px;pointer-events:none;}
.hero-grid{display:grid;gap:26px;align-items:center;}
.hero-copy{position:relative;z-index:1;}
.hero-copy h1{font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-1.5px;color:var(--c-primary-dark);max-width:760px;}
.hero-copy .lead{font-size:18px;max-width:690px;margin:18px 0 25px;}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.hero-badge{padding:7px 11px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);font-size:12px;font-weight:700;}
.hero-panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg);}
.hero-panel .panel-mark{font-size:42px;margin-bottom:12px;}
.feature-grid{display:grid;gap:14px;}
.feature-block{padding:24px;border-top:3px solid var(--c-accent);background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;}
.feature-block p{margin-bottom:0;}
.steps-redesign{display:grid;gap:12px;}
.step-redesign{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:17px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;}
.step-redesign .num{width:42px;height:42px;border-radius:12px;background:var(--c-primary);color:#fff;display:grid;place-items:center;font-weight:900;}
.cta-band{margin-top:34px;padding:28px;border-radius:20px;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.cta-band p{color:rgba(255,255,255,.78);margin:3px 0 0;}
.cta-band .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);}

// Professional photorealistic avatars — matches the existing DB enum public.avatar_type,
// extended from 8 to 12 values (6 male + 6 female; the original 4+4 keys/mapping are kept
// unchanged so existing users' saved avatar_id values keep working exactly as before).
// No upload, no Supabase Storage — the DB only ever stores the fixed avatar_id string; the
// image is resolved from a fixed local path per id. If an image file isn't present yet, a
// safe neutral fallback (a person icon, never a cartoon) is shown so the UI never breaks.
const AVATARS = {
  male_no_beard:      {img:'avatars/men/male_no_beard.png',       label:'بدون لحية',    gender:'male'},
  male_light_beard:   {img:'avatars/men/male_light_beard.png',    label:'لحية خفيفة',   gender:'male'},

  male_beard_jalabiya: {img:'avatars/men/male_beard_jalabiya.png', label:'لحية وجلباب',  gender:'male'},
  female_style_1:     {img:'avatars/women/female_style_1.png',    label:'محجبة',        gender:'female'},
  female_style_2:     {img:'avatars/women/female_style_2.png',    label:'حجاب أنيق',    gender:'female'},
  female_style_3:     {img:'avatars/women/female_style_3.png',    label:'حجاب طويل',    gender:'female'},
  female_style_4:     {img:'avatars/women/female_style_4.png',    label:'عباءة محتشمة', gender:'female'},
  female_niqab:        {img:'avatars/women/female_niqab.png',      label:'منتقبة',       gender:'female'},

function avatarsForGender(gender){
  const keys = Object.keys(AVATARS).filter(k=>AVATARS[k].gender===gender);
  // Unknown/missing gender: never break the page — fall back to showing everything.
  return keys.length ? keys : Object.keys(AVATARS);
}
// Renders one circular avatar photo (size in px). Falls back to a plain person icon —
// never a cartoon — if the image file is missing or fails to load, so a bare `avatars/...`
// folder with no files yet never breaks any page.
function avatarPhotoHtml(avatarId, size, extraClass){
  const a = AVATARS[avatarId];
  const s = size || 58;
  const cls = 'avatar-photo' + (extraClass ? (' ' + extraClass) : '');
  if(!a){
    return `<div class="${cls} avatar-photo--fallback" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.45)}px;"></div>`;
  }
  return `<div class="${cls}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.45)}px;">
    <img src="${a.img}" alt="${a.label}" loading="lazy" onerror="this.parentElement.classList.add('avatar-photo--fallback'); this.remove();">
  </div>`;
}

  // user-facing Arabic messages — show them as-is instead of falling through to the generic
  // catch-all below.

/* =========================================================
   6. API / RPC LAYER
========================================================= */
const api = {
  async rpc(name, args){ const {data,error} = await sb.rpc(name, args||{}); if(error) throw error; return data; },
  getProfileCompletion(){ return this.rpc('get_profile_completion_status'); },
  getPrefsCompletion(){ return this.rpc('get_preferences_completion_status'); },
  getMyFullProfile(){ return this.rpc('get_my_full_profile'); },
  getMySensitive(){ return this.rpc('get_my_sensitive_data'); },
  getMyPreferences(){ return this.rpc('get_my_preferences'); },
  // Read the real Supabase Auth session. UI state (S.session/localStorage) is never used
  // as proof of authentication for private candidate RPCs.
  async getAuthSession(){
    const {data, error} = await sb.auth.getSession();
    if(error) throw error;
    return data?.session || null;
  },
  async getCandidateProfiles(filters){
    const session = await this.getAuthSession();
    if(!session) return this.getPublicCandidateProfiles(filters);
    // Authenticated users always use the DB-protected private RPC. Never fall back to public discovery.
    return this.rpc('get_candidate_profiles', filters);
  },
  async getCandidateById(id){
    const candidateId = String(id ?? '').trim();
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(!candidateId || !UUID_RE.test(candidateId)) throw {code:'invalid_candidate_id', message:'Missing or invalid candidate ID'};
    const session = await this.getAuthSession();
    if(!session) return this.getPublicCandidateById(candidateId);
    // Authenticated users use the DB-protected private RPC (get_candidate_profile_by_id — verified
    // signature: p_candidate_id uuid). It requires an active session with auth.uid() resolvable server-side
    // (RAISE EXCEPTION 'Not authenticated' otherwise), an active account, and a completed profile.
    try{
      return await this.rpc('get_candidate_profile_by_id', {p_candidate_id:candidateId});
    }catch(err){
      // A client-side session object can exist while the JWT is expired/stale server-side (refresh
      // race, clock skew, revoked token). Postgres then sees auth.uid() IS NULL and raises
      // 'Not authenticated', which PostgREST surfaces as an HTTP 400. Treat that specific case like a
      // guest and retry against the public RPC instead of surfacing a raw 400 to the user.
      const msg = (err && err.message) || '';
      if(/not authenticated/i.test(msg)){
        return this.getPublicCandidateById(candidateId);
      }
      throw err;
    }
  },
  // Public, anon-safe discovery — no session required. Never returns phone/email/sensitive data.
  getPublicCandidateProfiles(filters){ return this.rpc('get_public_candidate_profiles', filters); },
  getPublicCandidateById(id){
    const candidateId = String(id ?? '').trim();
    if(!candidateId) return Promise.reject({code:'invalid_candidate_id', message:'Missing candidate ID'});
    return this.rpc('get_public_candidate_profile_by_id', {p_candidate_id:candidateId});
  },
  getMutualMatches(limit,offset){ return this.rpc('get_mutual_matches', {p_limit:limit||20, p_offset:offset||0}); },
  isAdmin(){ return this.rpc('is_admin'); },
  hasPerm(code){ return this.rpc('has_admin_permission', {p_permission_code:code}); },
  adminReview(requestId, decision, reason){ return this.rpc('admin_review_marriage_request', {p_request_id:requestId, p_decision:decision, p_reason:reason||null}); },
  adminReopenReview(requestId){ return this.rpc('admin_reopen_marriage_request_review', {p_request_id:requestId}); },
  adminListAdmins(){ return this.rpc('admin_list_admins'); },
  adminSearchUsersBasic(search){ return this.rpc('admin_search_users_basic', {p_search:search||null}); },
  adminListAllAccounts(){ return this.rpc('admin_list_all_accounts'); },

/* =========================================================
   4. AUTH
========================================================= */
// signUp() intentionally has NO emailRedirectTo / redirect options: we never want Supabase's
// confirmation-link flow to be the mechanism the user relies on. With "Confirm email" ON in the
// project's Auth settings, Supabase creates the account as unconfirmed and — as long as the Confirm
// signup email template contains {{ .Token }} — sends a 6-digit numeric code to that same address.
// full_name/phone travel to Postgres as auth.users.raw_user_meta_data via signUp's options.data.
// The handle_new_auth_user() DB trigger (public schema) is the real, authoritative enforcement:
// it requires and validates both for email/password signups, and rolls back the entire account
// creation (no auth.users row, no user_accounts/user_profiles rows) if either is missing or
// invalid — this call is not relied upon as the only line of defense.
async function doSignUp(email, password, fullName, phone){
  const {data, error} = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: fullName, phone: phone } }
  });
  if(error) throw error;
  return data;
}
// Verifies the code the user typed in (length = OTP_LENGTH). type:'email' is the current (non-deprecated) OTP type
// for both signup and sign-in confirmation in supabase-js v2 ('signup' is accepted but deprecated).
// On success this returns a real session — no separate sign-in call is needed afterwards.
async function verifyEmailOtp(email, token){
  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'email' });
  if(error) throw error;
  return data;
}
// Resends the signup OTP. type:'signup' is resend()'s own (separate) type enum — distinct from
// verifyOtp's type:'email' above. No emailRedirectTo here either.
async function resendSignupOtp(email){
  const {data, error} = await sb.auth.resend({ type: 'signup', email });
  if(error) throw error;
  return data;
}
async function doSignIn(email, password){
  const {data, error} = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return data;
}

/* ---- Forgot / Reset password (Recovery OTP — no link, same philosophy as signup OTP) ---- */
// resetPasswordForEmail() triggers Supabase's "Reset Password" email template (a template SEPARATE
// from "Confirm signup"). No redirectTo is passed, for the same reason signUp() has none: we never
// want the clicked-link flow. As long as that template contains {{ .Token }}, this sends a numeric
// code. Like signUp(), GoTrue does not reveal whether the email exists (anti-enumeration) — it
// resolves the same way either way, so the caller must always show a neutral message.
async function sendRecoveryOtp(email){
  const {data, error} = await sb.auth.resetPasswordForEmail(email);
  if(error) throw error;
  return data;
}
// type:'recovery' is the documented verifyOtp type for a password-reset code — distinct from the
// type:'email' used for signup/login confirmation above. Success returns a session that is already
// active on this client (supabase-js persists it internally), which updateUser() below relies on.
async function verifyRecoveryOtp(email, token){
  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'recovery' });
  if(error) throw error;
  return data;
}
// resend() has no 'recovery' type in its enum (only 'signup'|'email_change'|'sms'|'phone_change'),
// so — per Supabase's own docs — a recovery code is "resent" by calling resetPasswordForEmail()
// again, not by calling resend(). Reusing resendSignupOtp() here would silently call the wrong
// endpoint, so this is a separate function.
async function resendRecoveryOtp(email){ return sendRecoveryOtp(email); }
async function updatePassword(newPassword){
  const {data, error} = await sb.auth.updateUser({ password: newPassword });
  if(error) throw error;
  return data;
}
// OAuth (Google). This only works once the provider is actually enabled with real
// Client ID/Secret in Supabase Dashboard → Authentication → Providers; until then Supabase itself
// returns an error (e.g. "Unsupported provider") which friendlyError() will surface as-is.
async function signInWithOAuth(provider){
  const {data, error} = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: getAuthRedirectUrl() }
  });
  if(error) throw error;
  return data; // contains {url}; supabase-js redirects the browser itself
}

/* ---- OTP resend cooldown (client-side anti-spam; server also rate-limits) ---- */
// Single source of truth for the code length. Supabase is currently sending 8-digit codes to
// this project's Confirm-signup emails (confirmed against a real inbox), so every place that
// builds input boxes, validates length, or slices pasted text reads from this constant instead
// of assuming 6. If the project's OTP length ever changes again, only this line needs editing.
const OTP_LENGTH = 8;
const OTP_COOLDOWN_SECONDS = 60;
function otpCooldownKey(email){ return 'mawadda_otp_cd_' + email.trim().toLowerCase(); }
function setOtpCooldown(email, seconds){
  try{ localStorage.setItem(otpCooldownKey(email), String(Date.now() + (seconds||OTP_COOLDOWN_SECONDS)*1000)); }catch(e){}
}
function getOtpCooldownRemaining(email){
  try{
    const until = parseInt(localStorage.getItem(otpCooldownKey(email))||'0',10);
    return Math.max(0, Math.ceil((until - Date.now())/1000));
  }catch(e){ return 0; }
}
function clearOtpCooldown(email){ try{ localStorage.removeItem(otpCooldownKey(email)); }catch(e){} }
// Starts (or resumes, after a refresh) the OTP-entry screen for an email.
function startOtpFlow(email, purpose){
  S.otp = { email, purpose };
  navigate('/verify-otp');
}
async function doSignOut(){
  await sb.auth.signOut();
  Object.assign(S, {session:null, account:null, profile:null, profileStatus:null, prefStatus:null, isAdmin:false, adminPerms:{}, favoriteIds:null});
  navigate('/');
}

   5. ROUTER / VIEW MANAGER
========================================================= */
const PUBLIC_ROUTES = ['/','/login','/register','/discovery','/verify-otp','/forgot-password','/reset-password','/privacy','/contact'];
const PUBLIC_PREFIXES = ['/candidate/'];
function currentHash(){ return location.hash.replace(/^#/,'') || '/'; }
function navigate(path){
  // Mandatory notice gate: every path into /register — hero/CTA buttons, the
  // login page's "إنشاء حساب جديد" link, and the existing requireAuthGate() modal —
  // funnels through here, so gating it in one place covers every entry point.
  if(path==='/register' && !S.noticeConfirmed){ openRegisterNoticeGate(); return; }
  location.hash = path;
}
window.addEventListener('hashchange', ()=>render());

async function render(){
  const full = currentHash();
  const [path, qs] = full.split('?');
  S.route = path.split('/').slice(0,2).join('/') || '/';
  const parts = path.split('/').filter(Boolean);
  S.params = {};
  if(parts[0]==='candidate') S.params.id = parts[1];

  const loggedIn = !!S.session;
  if(!loggedIn && !PUBLIC_ROUTES.includes(path) && !PUBLIC_PREFIXES.some(p=>path.startsWith(p))){ navigate('/login'); return; }
  if(loggedIn && ['/login','/register','/verify-otp'].includes(path)){ navigate('/dashboard'); return; }

  document.getElementById('site-header').style.display = loggedIn ? 'block':'block';
  renderHeader();
  renderSidebar();
  renderBottomNav();

  const app = document.getElementById('app');
  window.scrollTo(0,0);

  const routeKey = parts[0] || 'landing';
  try{
    switch(routeKey){
      case '': case 'landing':
        if(loggedIn){ app.innerHTML = loadingBox(); navigate('/dashboard'); }
        else { app.innerHTML = viewLanding(); mountLandingExtras(); }
        break;
      case 'login':
        app.innerHTML = viewLogin(); mountAuthForm('login');
        openLoginNoticeModal(); // visible every time, never blocks sign-in
        break;
      case 'register':
        // Guards direct/typed/back-forward navigation to #/register that skips navigate()'s gate.
        if(!S.noticeConfirmed){ navigate('/'); openRegisterNoticeGate(); break; }
        app.innerHTML = viewRegister(); mountAuthForm('register');
        break;
      case 'verify-otp':
        if(!S.otp || !S.otp.email){ navigate('/login'); return; }
        app.innerHTML = viewVerifyOtp(); mountVerifyOtp(); break;
      case 'forgot-password': app.innerHTML = viewForgotPassword(); mountForgotPassword(); break;
      case 'privacy': app.innerHTML = viewPrivacy(); mountStaticPage(); break;
      case 'contact': app.innerHTML = viewContact(); mountStaticPage(); break;
      case 'reset-password':
        if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
        app.innerHTML = viewResetPassword(); mountResetPassword(); break;
      case 'dashboard': await mountDashboard(app); break;
      case 'profile': await mountProfile(app); break;
      case 'preferences': await mountPreferences(app); break;
      case 'discovery': await mountDiscovery(app); break;
      case 'candidate': await mountCandidate(app, S.params.id); break;
      case 'matches': await mountMatches(app); break;
      case 'favorites': await mountFavorites(app); break;
      case 'requests': await mountRequests(app); break;
      case 'guardians': await mountGuardians(app); break;
      case 'chat': await mountChat(app); break;
      case 'admin': await mountAdmin(app); break;
      default: app.innerHTML = emptyBox('🔍','الصفحة غير موجودة','تحقق من الرابط أو عد للرئيسية.');
    }
  }catch(e){
    console.error(e);
    app.innerHTML = errorBox(e);
  }
}

function toggleTheme(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next; localStorage.setItem('mawadda-theme',next); syncThemePills();
}
/* Updates every theme-pill on screen (header + sidebar can both be mounted) plus the sidebar text label */
function syncThemePills(){
  const dark = document.documentElement.dataset.theme==='dark';
  document.querySelectorAll('.theme-pill').forEach(p=>{
    p.dataset.on = dark?'dark':'light';
    p.setAttribute('aria-checked', dark?'true':'false');
    const knob = p.querySelector('.theme-pill-knob'); if(knob) knob.textContent = dark?'🌙':'☀️';
  });
  const label=document.getElementById('theme-label'); if(label) label.textContent = dark?'داكن':'فاتح';
}
function initTheme(){
  // The inline <head> script already set the initial theme before first paint (saved choice, else OS preference).
  // Here we only add a live listener so an unset (never toggled) theme keeps following OS changes.
  try{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', (e)=>{
      if(localStorage.getItem('mawadda-theme')) return; // user made an explicit choice — don't override it
      document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
      syncThemePills();
    });
  }catch(e){}
  syncThemePills();
}
/* Keyboard accessibility: every data-nav / data-cand element is a plain div/span with a click
   handler, so make each one focusable and operable with Enter/Space, matching real link/button semantics. */
function enhanceClickableA11y(root){
  root.querySelectorAll('[data-nav]:not([data-a11y]), [data-cand]:not([data-a11y])').forEach(el=>{
    el.setAttribute('data-a11y','1');
    if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
    if(el.tagName!=='BUTTON' && el.tagName!=='A' && !el.hasAttribute('role')) el.setAttribute('role','button');
  });
}
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest('[data-nav],[data-cand]');
  if(!el) return;
  e.preventDefault();
  el.click();
});
new MutationObserver(()=>enhanceClickableA11y(document.body)).observe(document.body, {childList:true, subtree:true});
function renderBottomNav(){
  const root = document.getElementById('bottom-nav-root');
  document.body.classList.remove('has-bottomnav');
  if(!S.session){ root.innerHTML=''; return; }
  const items = [
    ['/dashboard','🏠','الرئيسية'],['/discovery','🔎','استكشاف'],['/favorites','🔖','المفضلة'],['/requests','✉️','الطلبات'],['/profile','👤','الحساب']
  ];
  // S.isAdmin is set from the real DB-backed is_admin() RPC (see checkSession/bootstrap), never from
  // localStorage or any client-only flag. is_admin() returns true for SUPER_ADMIN too (verified against
  // the live schema: it checks for any active row in user_admin_roles, and SUPER_ADMIN is one such active
  // role), so this single DB-verified flag correctly covers both Admin and SUPER_ADMIN — no separate
  // SUPER_ADMIN branch or extra RPC call is needed here.
  if(S.isAdmin) items.push(['/admin','🛡️','الإدارة']);
  root.innerHTML = `<div class="bottom-nav">${items.map(([p,i,l])=>`
    <div class="bn-item ${S.route===p?'active':''}" data-nav="${p}"><span class="bn-icon">${i}</span>${l}</div>
  `).join('')}</div>`;
  root.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.getAttribute('data-nav')));
  document.body.classList.add('has-bottomnav');
}

function mountAuthForm(mode){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navigate(el.getAttribute('data-nav')));
  wirePasswordToggle('f-password','f-password-toggle');
  mountOAuthButtons();
  const forgotLink = document.getElementById('f-forgot-link');
  if(forgotLink) forgotLink.onclick = ()=>navigate('/forgot-password');
  const confirmInput = document.getElementById('f-password-confirm');
  const matchMsg = document.getElementById('pw-match-msg');
  if(mode==='register' && confirmInput){
    wirePasswordToggle('f-password-confirm','f-password-confirm-toggle');
    const pwInput = document.getElementById('f-password');
    const checkMatch = ()=>{
      if(!confirmInput.value){ matchMsg.textContent=''; matchMsg.className='pw-match-msg'; return; }
      const ok = pwInput.value === confirmInput.value;
      matchMsg.textContent = ok ? 'كلمتا المرور متطابقتان.' : 'كلمتا المرور غير متطابقتين.';
      matchMsg.className = 'pw-match-msg ' + (ok?'ok':'bad');
    };
    pwInput.addEventListener('input', checkMatch);
    confirmInput.addEventListener('input', checkMatch);
  }
  const btn = document.getElementById('f-submit');
  btn.onclick = async ()=>{
    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value;
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML='';
    if(!email || !password){ errBox.innerHTML = `<p class="field-error">أدخل البريد الإلكتروني وكلمة المرور.</p>`; return; }
    if(mode==='register' && confirmInput && password !== confirmInput.value){
      errBox.innerHTML = `<p class="field-error">كلمتا المرور غير متطابقتين.</p>`;
      return;
    }
    // Client-side check is UX-only (fast feedback, no round trip) — the DB trigger on
    // auth.users is what actually blocks account creation if either is missing/invalid.
    let fullName, phone;
    if(mode==='register'){
      fullName = document.getElementById('f-full-name').value.trim();
      phone = document.getElementById('f-phone').value.trim();
      if(!fullName){ errBox.innerHTML = `<p class="field-error">أدخل الاسم الكامل.</p>`; return; }
      if(!phone){ errBox.innerHTML = `<p class="field-error">أدخل رقم الهاتف.</p>`; return; }
    }
    btn.disabled = true; btn.textContent = 'جارٍ التنفيذ…';
    try{
      if(mode==='register'){
        const data = await doSignUp(email, password, fullName, phone);
        // Anti-enumeration: if this email is already registered & confirmed, Supabase returns a
        // user object with an EMPTY identities array and sends no email at all. Detect that and
        // send the person to login instead of parking them on an OTP screen that will never fill.
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          errBox.innerHTML = `<p class="field-error">هذا البريد الإلكتروني مسجل بالفعل. جرّب تسجيل الدخول.</p>`;
          return;
        }
        // Confirm Email is ON for this project, so signUp() must not return a live session.
        // Defensive-only: if it ever does (e.g. Confirm Email were switched off), never silently
        // treat that as "confirmed" — only trust an explicit email_confirmed_at.
        if(data.session && data.session.user?.email_confirmed_at){
          await bootAfterAuth(data.session);
          toast('تم إنشاء الحساب وتأكيد البريد.','success');
          navigate('/dashboard');
          return;
        }
        if(data.session){ await sb.auth.signOut(); }
        setOtpCooldown(email); // signUp already triggered the first OTP email
        toast(`تم إنشاء حسابك بنجاح. أرسلنا كود تأكيد مكوّنًا من ${OTP_LENGTH} أرقام إلى بريدك الإلكتروني.`,'success');
        startOtpFlow(email, 'register');
      } else {
        const data = await doSignIn(email, password);
        if(!data.session || !data.session.user?.email_confirmed_at){
          await sb.auth.signOut();
          throw { code:'email_not_confirmed', message:'Email not confirmed' };
        }
        await bootAfterAuth(data.session);
        toast('تم تسجيل الدخول','success');
        navigate('/dashboard');
      }
    }catch(e){
      const isUnconfirmed = (e && e.code==='email_not_confirmed') || /Email not confirmed/i.test((e&&e.message)||'');
      if(mode!=='register' && isUnconfirmed){
        errBox.innerHTML = `<div class="auth-success"><strong>البريد الإلكتروني غير مؤكد.</strong> أرسلنا لك كود تأكيد.<br><button class="btn btn-outline btn-sm" id="f-send-otp-login" style="margin-top:10px;">إرسال كود جديد</button></div>`;
        document.getElementById('f-send-otp-login').onclick = async ()=>{
          try{
            await resendSignupOtp(email);
            setOtpCooldown(email);
            toast('تم إرسال كود جديد إلى بريدك الإلكتروني.','success');
            startOtpFlow(email, 'login');
          }catch(re){ toast(friendlyError(re),'error'); }
        };
      } else {
        errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
      }
    }finally{
      btn.disabled = false; btn.textContent = mode==='register' ? 'إنشاء الحساب':'دخول';
    }
  };
}

function mountVerifyOtp(){
  if(!S.otp || !S.otp.email){ navigate('/login'); return; }
  const email = S.otp.email;
  const purpose = S.otp.purpose;
  const boxes = Array.from({length:OTP_LENGTH}, (_,i)=>document.getElementById('otp-'+i));
  const errBox = document.getElementById('otp-error');
  const confirmBtn = document.getElementById('otp-confirm');
  const resendEl = document.getElementById('otp-resend');
  const countdownWrap = document.getElementById('otp-countdown-wrap');

  boxes[0].focus();
  boxes.forEach((box,i)=>{
    box.addEventListener('input', ()=>{
      box.value = box.value.replace(/[^0-9]/g,'').slice(0,1);
      box.classList.remove('otp-err');
      if(box.value && i<OTP_LENGTH-1) boxes[i+1].focus();
    });
    box.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !box.value && i>0){ boxes[i-1].focus(); }
    });
    box.addEventListener('paste', (e)=>{
      const text = (e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
      if(!text) return;
      e.preventDefault();
      text.slice(0,OTP_LENGTH).split('').forEach((ch,idx)=>{ if(boxes[idx]){ boxes[idx].value = ch; } });
      const next = Math.min(text.length,OTP_LENGTH)-1;
      if(boxes[next]) boxes[next].focus();
    });
  });

  function markInvalid(){ boxes.forEach(b=>b.classList.add('otp-err')); }
  function collectCode(){ return boxes.map(b=>b.value).join(''); }

  async function doConfirm(){
    const code = collectCode();
    errBox.innerHTML='';
    if(code.length!==OTP_LENGTH){ errBox.innerHTML = `<p class="field-error">أدخل الكود المكوّن من ${OTP_LENGTH} أرقام كاملًا.</p>`; markInvalid(); return; }
    confirmBtn.disabled = true; confirmBtn.textContent='جارٍ التحقق…';
    try{
      // Same verification screen, different underlying Supabase OTP type per purpose: signup/login
      // confirmation uses type:'email', password recovery uses type:'recovery' (see the two
      // functions' comments above for why they can't be merged into one call).
      const data = purpose==='password_reset' ? await verifyRecoveryOtp(email, code) : await verifyEmailOtp(email, code);
      if(!data.session){ throw new Error('لم يتم إنشاء الجلسة، حاول مرة أخرى.'); }
      clearOtpCooldown(email);
      S.otp = null;
      if(purpose==='password_reset'){
        // Do NOT bootAfterAuth/dashboard here: this session exists only to authorize the next
        // updateUser({password}) call. The reset-password screen itself gates on S.recovery.
        S.recovery = { email };
        toast('تم التحقق من الكود. يمكنك الآن تعيين كلمة مرور جديدة.','success');
        navigate('/reset-password');
      } else {
        await bootAfterAuth(data.session);
        toast('تم تأكيد بريدك الإلكتروني بنجاح.','success');
        // Continue into the app's existing post-auth flow (dashboard nudges profile completion).
        navigate('/dashboard');
      }
    }catch(e){
      errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
      markInvalid();
      boxes.forEach(b=>b.value='');
      boxes[0].focus();
    }finally{
      confirmBtn.disabled = false; confirmBtn.textContent='تأكيد الكود';
    }
  }
  confirmBtn.onclick = doConfirm;

  let timer = null;
  function renderCountdown(){
    const remaining = getOtpCooldownRemaining(email);
    if(remaining<=0){
      resendEl.textContent = 'إعادة إرسال الكود';
      resendEl.classList.remove('disabled');
      resendEl.onclick = doResend;
      if(timer){ clearInterval(timer); timer=null; }
      return;
    }
    const mm = String(Math.floor(remaining/60)).padStart(2,'0');
    const ss = String(remaining%60).padStart(2,'0');
    resendEl.textContent = `إعادة الإرسال بعد ${mm}:${ss}`;
    resendEl.classList.add('disabled');
    resendEl.onclick = null;
  }
  async function doResend(){
    resendEl.classList.add('disabled');
    try{
      // resend() has no 'recovery' type — a recovery code must be re-requested via
      // resetPasswordForEmail() again (resendRecoveryOtp wraps that). See its definition above.
      if(purpose==='password_reset') await resendRecoveryOtp(email); else await resendSignupOtp(email);
      setOtpCooldown(email);
      toast('تم إرسال كود جديد إلى بريدك الإلكتروني.','success');
      boxes.forEach(b=>{ b.value=''; b.classList.remove('otp-err'); });
      boxes[0].focus();
    }catch(e){
      toast(friendlyError(e),'error');
      // If the server itself rate-limited us, keep the button disabled a bit so we don't hammer it.
      if(getOtpCooldownRemaining(email)<=0) setOtpCooldown(email, 30);
    }finally{
      renderCountdown();
    }
  }
  renderCountdown();
  timer = setInterval(renderCountdown, 1000);

  document.getElementById('otp-change-email').onclick = ()=>{
    if(timer){ clearInterval(timer); timer=null; }
    S.otp = null;
    navigate(purpose==='password_reset' ? '/forgot-password' : '/register');
  };
}

    <label>تأكيد كلمة المرور</label>

  </div></div>`;

function mountResetPassword(){
  if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
  wirePasswordToggle('rp-password','rp-password-toggle');
  wirePasswordToggle('rp-password-confirm','rp-password-confirm-toggle');
  const pw = document.getElementById('rp-password');
  const confirmInput = document.getElementById('rp-password-confirm');
  const matchMsg = document.getElementById('rp-match-msg');
  const checkMatch = ()=>{
    if(!confirmInput.value){ matchMsg.textContent=''; matchMsg.className='pw-match-msg'; return; }
    const ok = pw.value === confirmInput.value;
    matchMsg.textContent = ok ? 'كلمتا المرور متطابقتان.' : 'كلمتا المرور غير متطابقتين.';
    matchMsg.className = 'pw-match-msg ' + (ok?'ok':'bad');
  };
  pw.addEventListener('input', checkMatch);
  confirmInput.addEventListener('input', checkMatch);

  const btn = document.getElementById('rp-submit');
  btn.onclick = async ()=>{
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML='';
    if(!pw.value || pw.value.length<6){ errBox.innerHTML = `<p class="field-error">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</p>`; return; }
    if(pw.value !== confirmInput.value){ errBox.innerHTML = `<p class="field-error">كلمتا المرور غير متطابقتين.</p>`; return; }
    if(!S.recovery || !S.recovery.email){ navigate('/forgot-password'); return; }
    btn.disabled = true; btn.textContent = 'جارٍ التحديث…';
    try{
      await updatePassword(pw.value);
      S.recovery = null;
      // Force a clean, fresh login with the new password rather than continuing on the
      // short-lived recovery session, per the requested flow (back to /login, not /dashboard).
      await sb.auth.signOut();
      toast('تم تغيير كلمة المرور بنجاح. سجّل الدخول بكلمة المرور الجديدة.','success');
      navigate('/login');
    }catch(e){
      errBox.innerHTML = `<p class="field-error">${friendlyError(e)}</p>`;
    }finally{
      btn.disabled = false; btn.textContent = 'تغيير كلمة المرور';
    }
  };
}

// Clicking a notification now takes the person straight to the full detail of the
// marriage request it refers to, instead of just sitting there as inert text.
// Admins land on the pending-review list (where every field of the request is shown);
// regular users land on the matching tab of "طلبات الزواج" with their request highlighted.
async function openNotificationTarget(notifId, requestId){
  try{ if(notifId) await api.markNotificationRead(notifId); }catch(e){ /* non-fatal */ }
  if(!requestId){ mountDashboardNotifications(); return; }
  if(S.isAdmin){
    highlightRequestId = requestId;
    navigate('/admin');
    return;
  }
  try{
    const {data:r} = await sb.from('marriage_requests').select('sender_id,recipient_id').eq('id', requestId).single();
    if(r) requestsTab = (r.sender_id === S.session.user.id) ? 'sent' : 'received';
  }catch(e){ /* fall back to current tab */ }
  highlightRequestId = requestId;
  navigate('/requests');
}
// Scrolls to and briefly highlights the card matching highlightRequestId (if any), then
// clears it so it doesn't re-trigger on a later, unrelated visit to the same page.
function applyRequestHighlight(idPrefix){
  if(!highlightRequestId) return;
  const el = document.getElementById(idPrefix+highlightRequestId);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('highlight-pulse'); setTimeout(()=>el.classList.remove('highlight-pulse'), 2600); }
  highlightRequestId = null;
}

// Reads: S.account (user_accounts row, already fetched under its own RLS "select own" policy —
// gives member_code + phone_e164) and S.session.user.email (the person's own Supabase Auth
// session — no RPC needed to read one's own email). Writes: full_name/governorate_id/city_id/
// village_area go through the existing user_profiles UPDATE-own RLS policy (same table the
// "الأساسية" tab already writes to); phone goes through the existing upsert_my_phone() RPC,
// which is the only sanctioned way to change user_accounts.phone_e164 (no direct UPDATE policy
// exists on user_accounts, by design). member_code is never sent in any payload — it cannot be
// edited from here, matching prevent_member_code_update().
function renderAccountForm(panel, p){
  ensureGeo();
  const acc = S.account || {};
  const email = (S.session && S.session.user && S.session.user.email) || '';
  panel.innerHTML = `
    <div class="row-2">
      <div><label>كود العضو</label><input type="text" value="${acc.member_code||'—'}" disabled></div>
      <div><label>حالة الحساب</label><input type="text" value="${L('request_status', acc.status)!==acc.status ? L('request_status', acc.status) : (acc.status||'—')}" disabled></div>
    </div>
    <label>الاسم</label><input type="text" id="ac-full_name" value="${p.full_name||''}">
    <label>البريد الإلكتروني المرتبط بالحساب</label><input type="email" value="${email}" disabled>
    <div class="hint">البريد المرتبط بحساب الدخول (Auth) — لا يمكن تعديله من هنا.</div>
    <label>رقم الهاتف</label><input type="tel" id="ac-phone" value="${acc.phone_e164||''}" placeholder="01xxxxxxxxx">
    <div class="row-2">
      <div><label>المحافظة</label><select id="ac-governorate_id"><option value="">اختر</option></select></div>
      <div><label>المركز</label><select id="ac-city_id"><option value="">اختر المحافظة أولًا</option></select></div>
    </div>
    <div id="ac-village_area-wrap" style="display:none;">
      <label>المنطقة / القرية / النجع <span class="muted" style="font-weight:400;">(اختياري)</span></label>
      <input type="text" id="ac-village_area" maxlength="150" value="${p.village_area||''}">
    </div>
    <label>الصورة الرمزية (Avatar)</label>
    <div class="hint" style="margin-bottom:8px;">اختر صورة تعبيرية احترافية من المجموعة الجاهزة — لا يوجد رفع صور شخصية حقيقية.</div>
    <div id="ac-avatar-grid" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;"></div>
    <button class="btn btn-primary btn-block" id="ac-save" style="margin-top:16px;">حفظ الملف الشخصي</button>
  `;
  let selectedAvatar = p.avatar_id || null;
  function renderAvatarGrid(){
    const grid = document.getElementById('ac-avatar-grid');
    const keys = avatarsForGender(p.gender);
    grid.innerHTML = keys.map(k=>{
      const a = AVATARS[k];
      const on = selectedAvatar===k;
      return `
      <div class="ac-avatar-opt" data-avatar="${k}" style="cursor:pointer;text-align:center;padding:6px;border-radius:14px;border:2px solid ${on?'var(--c-primary)':'var(--c-border)'};background:${on?'var(--c-accent-light)':'transparent'};width:84px;">
        <div class="avatar-photo" style="width:70px;height:70px;border-radius:12px;margin:0 auto;font-size:26px;">
          <img src="${a.img}" alt="${a.label}" loading="lazy" onerror="this.parentElement.classList.add('avatar-photo--fallback'); this.remove();">
        </div>
        <div style="font-size:10.5px;margin-top:4px;">${a.label}</div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.ac-avatar-opt').forEach(el=>{
      el.onclick = ()=>{ selectedAvatar = el.dataset.avatar; renderAvatarGrid(); };
    });
  }
  renderAvatarGrid();
  const govSel = document.getElementById('ac-governorate_id');
  const citySel = document.getElementById('ac-city_id');
  const villageWrap = document.getElementById('ac-village_area-wrap');
  const villageInput = document.getElementById('ac-village_area');
  function syncVillageVisibility(){
    if(citySel.value){ villageWrap.style.display='block'; }
    else{ villageWrap.style.display='none'; villageInput.value=''; }
  }
  async function fillGov(){
    await ensureGeo();
    govSel.innerHTML = `<option value="">اختر</option>` + S.governorates.map(g=>`<option value="${g.id}" ${p.governorate_id==g.id?'selected':''}>${g.name_ar}</option>`).join('');
    await fillCities(p.governorate_id);
    syncVillageVisibility();
  }
  async function fillCities(govId){
    if(!govId){ citySel.innerHTML = `<option value="">اختر المحافظة أولًا</option>`; syncVillageVisibility(); return; }
    const {data} = await sb.from('geo_cities').select('*').eq('governorate_id', govId).eq('is_active',true).order('sort_order');
    if(!data || !data.length){ citySel.innerHTML = `<option value="">لا توجد مدن متاحة حاليًا لهذه المحافظة</option>`; syncVillageVisibility(); return; }
    citySel.innerHTML = `<option value="">اختر</option>` + data.map(c=>`<option value="${c.id}" ${p.city_id==c.id?'selected':''}>${c.name_ar}</option>`).join('');
    syncVillageVisibility();
  }
  fillGov();
  govSel.onchange = (e)=>fillCities(e.target.value);
  citySel.onchange = syncVillageVisibility;

  document.getElementById('ac-save').onclick = async ()=>{
    const btn = document.getElementById('ac-save');
    btn.disabled=true; btn.textContent='جارٍ الحفظ…';
    try{
      // 1) Phone — only through the existing phone RPC/system, only if changed.
      const newPhone = val('ac-phone');
      if(newPhone && newPhone !== (acc.phone_e164||'')){
        await api.upsertMyPhone(newPhone);
      }
      // 2) Name / geography / avatar — same table + RLS the "الأساسية" tab already uses.
      // member_code is intentionally never included (immutable, enforced by DB trigger too).
      const payload = {
        user_id: S.session.user.id,
        full_name: val('ac-full_name'),
        governorate_id: numOrNull('ac-governorate_id'),
        city_id: numOrNull('ac-city_id'),
        village_area: citySel.value ? val('ac-village_area') : null,
        avatar_id: selectedAvatar || null
      };
      const {error} = await sb.from('user_profiles').upsert(payload, {onConflict:'user_id'});
      if(error) throw error;
      // Refresh cached account (phone) + profile completion state so the rest of the UI stays in sync.
      const {data: acc2} = await sb.from('user_accounts').select('*').eq('id', S.session.user.id).maybeSingle();
      if(acc2) S.account = acc2;
      toast('تم حفظ الملف الشخصي الخاص بك','success');
      S.profileStatus = await api.getProfileCompletion();
      await mountProfile(document.getElementById('app'));
    }catch(e){ toast(friendlyError(e),'error'); }
    finally{ btn.disabled=false; btn.textContent='حفظ الملف الشخصي'; }
  };
}

function selOpts(group, current){ return Object.entries(LABELS[group]).map(([v,t])=>`<option value="${v}" ${current===v?'selected':''}>${t}</option>`).join(''); }
// Reusable "أخرى — اكتب" reveal-input block for enum fields that support a free-text detail column
// (pattern established by disability_type/disability_other_details; mirrored for beard/hijab/hair_color/
// body_build/skin_tone/housing_type). fieldPrefix must match the input id used in the payload builder.
function otherDetailsHtml(fieldPrefix, label, currentValue, currentDetail){
  return `<div id="${fieldPrefix}-details-wrap" style="display:${currentValue==='other'?'block':'none'};margin-top:8px;">
    <label>${label}</label><input type="text" id="${fieldPrefix}_other_details" maxlength="150" value="${currentDetail||''}">
  </div>`;
}
function wireOtherReveal(selectId, fieldPrefix){
  const el = document.getElementById(selectId);
  if(el) el.onchange = (e)=>{ document.getElementById(fieldPrefix+'-details-wrap').style.display = e.target.value==='other' ? 'block':'none'; };
}
function val(id){ const el=document.getElementById(id); return el? el.value.trim ? el.value.trim() : el.value : ''; }
function numOrNull(id){ const v = val(id); return (v===''||v===undefined) ? null : Number(v); }
// Strict integer parser for smallint DB columns (height_cm, weight_kg, children_count, ...).
// Throws a clear Arabic error instead of silently rounding or letting a decimal reach Postgres
// as "invalid input syntax for type smallint" (22P02).
function intOrNull(id, label, lo, hi){
  const v = val(id);
  if(v===''||v===undefined||v===null) return null;
  const n = Number(v);
  if(!Number.isFinite(n)) throw Object.assign(new Error(`${label}: قيمة غير صالحة`), {isValidationError:true});
  if(!Number.isInteger(n)) throw Object.assign(new Error(`${label} يجب أن يكون رقمًا صحيحًا بدون كسور عشرية (مثال: 191 وليس 191.4)`), {isValidationError:true});
  if(lo!==undefined && n<lo) throw Object.assign(new Error(`${label} يجب ألا يقل عن ${lo}`), {isValidationError:true});
  if(hi!==undefined && n>hi) throw Object.assign(new Error(`${label} يجب ألا يزيد عن ${hi}`), {isValidationError:true});
  return n;
}
// Formats a DB timestamp (e.g. user_accounts.created_at) as "26/09/2026 — 05:10 م".
// Always derived from the timestamp string itself — never the local clock or localStorage.
function formatDateTimeAr(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const datePart = d.toLocaleDateString('ar-EG-u-nu-latn', {day:'2-digit', month:'2-digit', year:'numeric'});
  const timePart = d.toLocaleTimeString('ar-EG-u-nu-latn', {hour:'2-digit', minute:'2-digit', hour12:true});
  return `${datePart} — ${timePart}`;
}

// Mirrors DB CHECK constraints on user_preferences (chk_pref_age_bounds/range, height, weight)
// so invalid input is caught client-side with a clear message instead of a raw 400 from Postgres.
function validatePrefRanges(){
  const checks = [
    {min:'pr-min_age', max:'pr-max_age', lo:18, hi:100, label:'العمر'},
    {min:'pr-min_height_cm', max:'pr-max_height_cm', lo:100, hi:250, label:'الطول'},
    {min:'pr-min_weight_kg', max:'pr-max_weight_kg', lo:30, hi:300, label:'الوزن'}
  ];
  for(const c of checks){
    const minV = numOrNull(c.min), maxV = numOrNull(c.max);
    if(minV!==null && (minV<c.lo || minV>c.hi)) return `الحد الأدنى لـ${c.label} يجب أن يكون بين ${c.lo} و${c.hi}.`;
    if(maxV!==null && (maxV<c.lo || maxV>c.hi)) return `الحد الأقصى لـ${c.label} يجب أن يكون بين ${c.lo} و${c.hi}.`;
    if(minV!==null && maxV!==null && minV>maxV) return `الحد الأدنى لـ${c.label} لا يمكن أن يكون أكبر من الحد الأقصى.`;
  }
  return null;
}
function multiChips(group, currentArr){
  const cur = new Set(currentArr||[]);
  return Object.entries(LABELS[group]).map(([v,t])=>`<span class="chip chip-select ${cur.has(v)?'on':''}" data-v="${v}">${t}</span>`).join('');
}
function chipsOn(containerId){ return [...document.getElementById(containerId).querySelectorAll('.chip-select.on')].map(c=>c.dataset.v); }

let discoveryOffset = 0;
const DISCOVERY_LIMIT = 12;
async function mountDiscovery(app){
  await ensureGeo();
  app.innerHTML = `
  <div class="container">
    <h2>استكشاف المرشحين</h2>
    <div class="card card-tight">

      <label>الحالة الاجتماعية</label><div id="df-marital">${multiChips('marital_status',[])}</div>
      <button class="btn btn-primary btn-sm" id="df-apply" style="margin-top:14px;">تطبيق الفلاتر</button>
    </div>
    <div id="disc-results" style="margin-top:18px;">${loadingBox('جارِ البحث عن مرشحين…')}</div>
  </div>`;
  document.querySelectorAll('#df-marital .chip-select').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  document.getElementById('df-apply').onclick = ()=>{ discoveryOffset=0; runDiscovery(); };
  discoveryOffset = 0;
  runDiscovery();
}
async function runDiscovery(){
  const box = document.getElementById('disc-results');
  box.innerHTML = loadingBox('جارِ البحث…');
  const filters = {
    p_limit: DISCOVERY_LIMIT, p_offset: discoveryOffset,
    p_min_age: numOrNull('df-min_age'), p_max_age: numOrNull('df-max_age'),
    p_governorate_id: numOrNull('df-gov'),
    p_marital_statuses: chipsOn('df-marital').length? chipsOn('df-marital') : null
  };
  try{
    const authSession = await api.getAuthSession();
    // Public discovery is only for anonymous visitors. Authenticated users are never downgraded to public data.
    const res = authSession ? await api.getCandidateProfiles(filters) : await api.getPublicCandidateProfiles(filters);
    await ensureFavoritesLoaded();
    if(!res.items || !res.items.length){
      box.innerHTML = emptyBox('🔍','لا توجد نتائج مطابقة',authSession?'أكمل ملفك الشخصي وتفضيلاتك أولًا أو جرّب تعديل الفلاتر.':'لا توجد ملفات عامة متاحة حاليًا.');
      return;
    }
    box.innerHTML = `<div class="grid grid-3">${res.items.map(candCard).join('')}</div>
      <div class="flex" style="justify-content:center; gap:10px; margin-top:20px;">
        <button class="btn btn-outline btn-sm" id="disc-prev" ${discoveryOffset===0?'disabled':''}>السابق</button>
        <span class="muted">${discoveryOffset+1}–${discoveryOffset+res.returned_count} من ${res.total_count}</span>
        <button class="btn btn-outline btn-sm" id="disc-next" ${!res.has_more?'disabled':''}>التالي</button>
      </div>`;
    box.querySelectorAll('[data-cand]').forEach(el=>el.onclick=()=>navigate('/candidate/'+el.dataset.cand));
    wireFavButtons(box);
    const prev = document.getElementById('disc-prev'); if(prev) prev.onclick=()=>{ discoveryOffset=Math.max(0,discoveryOffset-DISCOVERY_LIMIT); runDiscovery(); };
    const next = document.getElementById('disc-next'); if(next) next.onclick=()=>{ discoveryOffset+=DISCOVERY_LIMIT; runDiscovery(); };
  }catch(e){ box.innerHTML = errorBox(e); }
}
function candCard(c){

/* =========================================================
   FAVORITES (🔖 المفضلة) — pure save-for-later on top of the existing
   `user_favorites` table. Deliberately separate from ❤️ marriage_requests:
   no notification, no admin review cycle, just a private bookmark the
   user manages themselves. RLS on user_favorites already enforces
   own-rows-only / no-self / no-duplicate; this layer never bypasses it.
========================================================= */
// Lazily loads the current user's favorited candidate_ids into a Set, cached on S.favoriteIds.
// Guests get an empty Set (RLS would reject them anyway) so button rendering never has to null-check.
async function ensureFavoritesLoaded(){
  if(!S.session){ S.favoriteIds = new Set(); return; }
  if(S.favoriteIds) return;
  try{
    const {data, error} = await sb.from('user_favorites').select('candidate_id').eq('user_id', S.session.user.id);
    if(error) throw error;
    S.favoriteIds = new Set((data||[]).map(r=>r.candidate_id));
  }catch(e){ S.favoriteIds = new Set(); }
}
function favoriteButtonHtml(candidateId){
  return `<button type="button" class="btn btn-outline btn-sm fav-btn" data-fav="${candidateId}">🔖 حفظ للمفضلة</button>`;
}
function applyFavButtonState(btn, candidateId){
  const on = !!(S.favoriteIds && S.favoriteIds.has(candidateId));
  btn.className = 'btn btn-sm fav-btn ' + (on ? 'btn-primary' : 'btn-outline');
  btn.textContent = on ? '✅ في المفضلة' : '🔖 حفظ للمفضلة';
}
// Wires every .fav-btn under `root`. Pass onToggle(candidateId, isNowFavorited) to react to a change
// (e.g. remove the card from a "My Favorites" list once it's un-favorited).
function wireFavButtons(root, onToggle){
  root.querySelectorAll('.fav-btn').forEach(btn=>{
    const candidateId = btn.dataset.fav;
    applyFavButtonState(btn, candidateId);
    btn.onclick = async (e)=>{
      e.stopPropagation(); // cards themselves are clickable (data-cand) — never trigger navigation
      if(!requireAuthGate('حفظ المرشحين في المفضلة')) return;
      if(candidateId === S.session.user.id){ toast('لا يمكنك إضافة نفسك للمفضلة','error'); return; }
      const wasOn = S.favoriteIds.has(candidateId);
      btn.disabled = true;
      try{
        if(wasOn){
          const {error} = await sb.from('user_favorites').delete().eq('user_id', S.session.user.id).eq('candidate_id', candidateId);
          if(error) throw error;
          S.favoriteIds.delete(candidateId);
          toast('تمت الإزالة من المفضلة','success');
        } else {
          const {error} = await sb.from('user_favorites').insert({user_id:S.session.user.id, candidate_id:candidateId});
          if(error) throw error;
          S.favoriteIds.add(candidateId);
          toast('تمت الإضافة إلى المفضلة','success');
        }
        applyFavButtonState(btn, candidateId);
        if(onToggle) onToggle(candidateId, S.favoriteIds.has(candidateId));
      }catch(ex){ toast(friendlyError(ex),'error'); }
      finally{ btn.disabled=false; }
    };
  });
}
async function mountFavorites(app){
  if(!requireAuthGate('صفحة المفضلة')){ app.innerHTML = ''; return; }
  app.innerHTML = `<div class="container"><h2>🔖 المفضلة</h2><div id="fav-results">${loadingBox('جارِ تحميل المفضلة…')}</div></div>`;
  const box = document.getElementById('fav-results');
  try{
    await ensureFavoritesLoaded();
    const ids = Array.from(S.favoriteIds);
    if(!ids.length){ box.innerHTML = emptyBox('🔖','لا توجد عناصر محفوظة بعد','احفظ أي مرشح من صفحة الاستكشاف أو ملفه الشخصي للرجوع إليه لاحقًا.'); return; }
    const results = await Promise.all(ids.map(id=>api.getCandidateById(id).catch(()=>null)));
    const cards = results.map((c,i)=> c ? candCard(c) : `<div class="cand-card" data-fav-missing="${ids[i]}"><p class="mb0 muted">هذا الملف لم يعد متاحًا حاليًا</p>${favoriteButtonHtml(ids[i])}</div>`).join('');
    box.innerHTML = `<div class="grid grid-3">${cards}</div>`;
    box.querySelectorAll('[data-cand]').forEach(el=>el.onclick=()=>navigate('/candidate/'+el.dataset.cand));
    wireFavButtons(box, (id, isNowFav)=>{
      if(!isNowFav){
        const card = box.querySelector(`[data-cand="${id}"]`) || box.querySelector(`[data-fav-missing="${id}"]`);
        if(card) card.remove();
        if(!box.querySelector('.cand-card')) box.innerHTML = emptyBox('🔖','لا توجد عناصر محفوظة بعد','احفظ أي مرشح من صفحة الاستكشاف أو ملفه الشخصي للرجوع إليه لاحقًا.');
      }
    });
  }catch(e){ box.innerHTML = errorBox(e); }
}

// Renders a "field: value" line only when there's something to show, so the layout never
// shows empty labels — but ANYTHING the candidate actually filled in is displayed, which
// is the whole point: previously most of get_candidate_profile_by_id()'s fields were simply
// never read by this screen, so real registered data (height, weight, skin tone, hair
// color, hijab/beard, health status, disability, bio, children, housing type, religious
// commitment, smoking...) was silently dropped even though the backend already sent it.
function pRow(label, value){
  if(value===null||value===undefined||value===''||value==='—') return '';
  return `<p class="mb0"><strong>${label}:</strong> ${value}</p>`;
}
function candidateProfileHtml(c){
  const gov = c.governorate ? c.governorate.name_ar : null;
  const city = c.city ? c.city.name_ar : null;
  const location = [gov, city].filter(Boolean).join(' — ');
  const withOther = (group, val, other) => val ? (val==='other' && other ? `${L(group,val)} (${other})` : L(group,val)) : null;
  const traits = (c.personality_traits||[]).filter(Boolean);
  const traitsHtml = traits.length ? traits.map(t=>`<span class="chip">${L('personality_trait',t)}</span>`).join('') : '';
  const children = (c.children||[]).filter(Boolean);
  const childrenHtml = children.length ? children.map(ch=>`<span class="chip">${ch.approximate_age!=null?ch.approximate_age+' سنة':'عمر غير محدد'}${ch.lives_with_user===false?' · خارج بيت الحاضن':''}</span>`).join('') : '';

  const basics = [
    pRow('الحالة الاجتماعية', L('marital_status', c.marital_status)),
    pRow('المكان', location || null),
    pRow('المؤهل الدراسي', L('education_level', c.education_level)),
    pRow('التخصص', c.education_major),
  ].join('');

  const appearance = [
    pRow('الطول', c.height_cm!=null ? c.height_cm+' سم' : null),
    pRow('الوزن', c.weight_kg!=null ? c.weight_kg+' كجم' : null),
    pRow('بنية الجسم', withOther('body_build', c.body_build, c.body_build_other_details)),
    pRow('لون البشرة', withOther('skin_tone', c.skin_tone, c.skin_tone_other_details)),
    pRow('لون الشعر', withOther('hair_color', c.hair_color, c.hair_color_other_details)),
    c.gender==='male' ? pRow('اللحية', withOther('beard', c.beard, c.beard_other_details)) : '',
    c.gender==='female' ? pRow('الحجاب', withOther('hijab', c.hijab, c.hijab_other_details)) : '',
  ].join('');

  const health = [
    pRow('الحالة الصحية', L('health_status', c.health_status)),
    pRow('الإعاقة', withOther('disability_type', c.disability_type && c.disability_type!=='none' ? c.disability_type : null, c.disability_other_details)),
  ].join('');

  const work = [
    pRow('المسمى الوظيفي', c.job_title),
    pRow('استقرار العمل', L('work_stability', c.work_stability)),
  ].join('');

  const family = [
    pRow('عدد الأطفال', c.children_count!=null ? String(c.children_count) : null),
  ].join('') + (childrenHtml ? `<div style="margin-top:6px;">${childrenHtml}</div>` : '');

  const lifestyle = [
    pRow('الحالة السكنية', L('housing_status', c.housing_status)),
    pRow('نوع السكن', withOther('housing_type', c.housing_type, c.housing_type_other_details)),
    pRow('الاستعداد للانتقال', L('relocation_willingness', c.relocation_willingness)),
    pRow('العمل بعد الزواج', L('work_after_marriage', c.work_after_marriage)),
    pRow('الرغبة في الإنجاب', L('childbearing_preference', c.childbearing_preference)),
    pRow('جاهزية بيت الزوجية', L('home_readiness', c.home_readiness)),
  ].join('');

  const commitment = [
    pRow('الالتزام بالصلاة', L('commitment', c.prayer_commitment)),
    pRow('الالتزام بالصيام', L('commitment', c.fasting_commitment)),
    pRow('التدخين', L('smoking_status', c.smoking_status)),
  ].join('');

  const section = (title, body) => body ? `<div class="profile-section"><h3>${title}</h3>${body}</div>` : '';

  return `
    <div class="profile-section" style="margin-top:12px;"><div class="cand-summary">${avatarPhotoHtml(c.avatar_id,58,'cand-avatar')}<div><div class="eyebrow">ملف مرشح</div><h2>${c.age??'—'} سنة</h2><span class="badge badge-muted">${L('gender',c.gender)}</span></div></div></div>
    ${section('البيانات الأساسية', basics)}
    ${c.bio ? section('نبذة شخصية', `<p class="mb0">${c.bio}</p>`) : ''}
    ${section('المظهر', appearance)}
    ${section('الحالة الصحية', health)}
    ${section('التعليم والعمل', work)}
    ${(c.children_count!=null && c.children_count>0) ? section('الأطفال', family) : ''}
    ${section('السكن ونمط الحياة', lifestyle)}
    ${section('الالتزام الديني والعادات', commitment)}
    ${traitsHtml ? section('الصفات الشخصية', `<div>${traitsHtml}</div>`) : ''}
  `;
}

async function renderSentRequests(panel){
  const {data, error} = await sb.from('marriage_requests').select('*').eq('sender_id', S.session.user.id).order('created_at',{ascending:false});
  if(error) throw error;
  if(!data.length){ panel.innerHTML = emptyBox('✉️','لم ترسل أي طلبات بعد','توجّه لصفحة الاستكشاف لإرسال طلب تعارف.'); return; }
  const {data: reviews} = await sb.from('marriage_request_reviews').select('*').in('request_id', data.map(r=>r.id));
  const reviewMap = Object.fromEntries((reviews||[]).map(r=>[r.request_id, r]));
  const states = await Promise.all(data.map(r=>api.getAcceptanceState(r.id).catch(()=>null)));
  panel.innerHTML = data.map((r,i)=>{
    const rev = reviewMap[r.id]; const st=states[i]; const mine=st&&st.mine?st.mine.decision:null;
    const approved=rev&&rev.decision==='approved';
    return `<div class="card card-tight" id="req-${r.id}" style="margin-bottom:10px;">
      <div class="flex-between"><span class="badge ${statusBadgeClass(r.status)}">${L('request_status',r.status)}</span><span class="muted" style="font-size:12px;">${new Date(r.created_at).toLocaleDateString('ar-EG')}</span></div>

      ${approved?`<p class="mb0" style="margin-top:6px;">موافقتك: <strong>${mine==='accepted'?'موافق':mine==='rejected'?'رافض':'لم تُسجّل بعد'}</strong>${st&&st.mutual_acceptance?' · <span class="badge badge-success">قبول متبادل</span>':''}</p>`:''}
      <div class="flex gap8" style="margin-top:10px;">
        <button class="btn btn-outline btn-sm" data-view="${r.recipient_id}">عرض الملف</button>
        ${approved&&!st?.mutual_acceptance&&mine!=='accepted'?`<button class="btn btn-success btn-sm" data-accept-sent="${r.id}">قبول</button>`:''}
        ${approved&&!st?.mutual_acceptance&&mine!=='rejected'?`<button class="btn btn-danger btn-sm" data-decline-sent="${r.id}">رفض</button>`:''}
        ${r.status==='pending'?`<button class="btn btn-danger btn-sm" data-withdraw="${r.id}">سحب الطلب</button>`:''}

    confirmModal('سحب الطلب','هل أنت متأكد من سحب طلب الزواج هذا؟','سحب', async ()=>{
      try{
        const {error} = await sb.from('marriage_requests').update({status:'withdrawn'}).eq('id', b.dataset.withdraw);
        if(error) throw error;
        toast('تم سحب الطلب','success');
        mountRequests(document.getElementById('app'));
      }catch(e){ toast(friendlyError(e),'error'); }
    }, true);
  });

async function renderGuardiansList(){

  try{

    if(!data.length){ list.innerHTML = emptyBox('👪','لم تُضِف أي ولي بعد','أضف بيانات ولي أمرك لمزيد من الطمأنينة والجدية.'); return; }

    </div>`).join('');

      confirmModal('حذف الولي','هل تريد حذف بيانات هذا الولي؟','حذف', async ()=>{
        try{ const {error} = await sb.from('user_guardians').delete().eq('id', b.dataset.del); if(error) throw error;
          toast('تم الحذف','success'); renderGuardiansList();

function openGuardianModal(existing){
  openModal(`
    <h3>${existing?'تعديل بيانات الولي':'إضافة ولي'}</h3>
    <label>الاسم</label><input type="text" id="gm-name" value="${existing?existing.guardian_name:''}">

  `, (root)=>{
    root.querySelector('#gm-save').onclick = async ()=>{
      const payload = { guardian_name: val('gm-name'), relationship: val('gm-rel'), phone: val('gm-phone'), email: val('gm-email')||null };

      }catch(e){ toast(friendlyError(e),'error'); }

}
