// Unified admin user-detail view — used from: the all-accounts list (Member Code/Email ↔
// Account ↔ Auth), and from the pending marriage-requests review (sender/recipient). Reuses
// the existing L()/LABELS enum-label mapping, avatarPhotoHtml(), formatDateTimeAr() and
// openModal() instead of building a separate profile system. Phone is only shown when the
// RPC itself returned it (gated server-side on the phone.view admin permission).
function ageFromDob(dob){
  if(!dob) return null;
  const b = new Date(dob); if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

            document.querySelectorAll('.admin-side-link').forEach(x=>x.classList.toggle('active', x.dataset.sec==='chat'));
            document.querySelectorAll('.admin-panel').forEach(p=>{ p.hidden = p.dataset.panel!=='chat'; });
            await renderAdminChatThreads();
          }else{
            navigate('/admin');
          }
        }catch(e){ toast(friendlyError(e),'error'); msgBtn.disabled = false; }
      };
    }
  }catch(e){
    const target = document.getElementById('admin-user-detail-body');
    if(target) target.innerHTML = errorBox(e);
  }
}

// Same detail modal as openAdminUserDetail(), but starting from a Member Code —
// used wherever a list only has member_code (complaints, warnings, disclosures,
// chat threads, audit log) instead of the account UUID.
async function openAdminUserDetailByCode(code){
  if(!code) return;
  try{
    if(!adminAllAccountsCache) adminAllAccountsCache = await api.adminListAllAccounts();
    const row = adminAllAccountsCache.find(a=>a.member_code===code);
    if(!row){ toast('تعذر العثور على هذا الحساب','error'); return; }
    openAdminUserDetail(row.account_id);
  }catch(e){ toast(friendlyError(e),'error'); }
}

let adminChatActiveThreadId = null;
async function renderAdminChatThreads(){
  const box = document.getElementById('admin-chat-thread-list');
  if(!box) return;
  try{
    const threads = await api.adminListChatThreads();
    if(!threads.length){ box.innerHTML = emptyBox('💬','لا توجد محادثات','ستظهر هنا محادثات الأعضاء مع الإدارة.'); return; }
    box.innerHTML = threads.map(t=>`
      <div class="card card-tight admin-chat-thread-item" data-athread="${t.thread_id}" style="margin-bottom:8px;cursor:pointer;${t.thread_id===adminChatActiveThreadId?'border-color:var(--c-primary);':''}">
        <div class="flex-between"><strong>${t.full_name||t.member_code}</strong>${t.is_unread?`<span class="badge badge-warn">جديدة</span>`:chatStatusBadge(t.status)}</div>

async function renderAdminChatMessagesPanel(thread){

  if(!thread){ panel.innerHTML = `<p class="muted">اختر محادثة من القائمة.</p>`; return; }
  panel.innerHTML = loadingBox();
  let messages;
  try{ messages = await api.chatMessages(thread.thread_id); }catch(e){ panel.innerHTML = errorBox(e); return; }
  const uid = S.session.user.id;
  panel.innerHTML = `
    <div class="flex-between"><strong class="admin-link" data-open-code="${thread.member_code}">${thread.full_name||thread.member_code}</strong>${chatStatusBadge(thread.status)}</div>
    <div class="chat-messages" style="max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px;">

    </div>
    <div class="flex gap8" style="margin-top:10px;">
      ${thread.status==='closed'
        ? `<button class="btn btn-outline btn-sm" id="admin-chat-reopen">إعادة فتح المحادثة</button>`
        : `<textarea id="admin-chat-reply-body" style="flex:1;min-height:50px;" placeholder="اكتب ردك…"></textarea><button class="btn btn-primary" id="admin-chat-reply-send">إرسال</button><button class="btn btn-danger btn-sm" id="admin-chat-close">إغلاق</button>`}

      catch(e){ toast(friendlyError(e),'error'); }
    }, true);
  };
  const reopenBtn = document.getElementById('admin-chat-reopen');
  if(reopenBtn) reopenBtn.onclick = async ()=>{
    try{ await api.adminSetThreadStatus(thread.thread_id,'open'); toast('تم إعادة فتح المحادثة','success'); await renderAdminChatThreads(); }
    catch(e){ toast(friendlyError(e),'error'); }
  };
}

// Marriage-request history tabs. "review_*" tabs come from marriage_request_reviews
// (the admin's own approve/reject decision); "final_*"/"withdrawn" come from
// marriage_requests.status (what the two members themselves did). Both are shown
// together on each card so an admin never has to jump between screens to see the
// full picture of one request.
const ADMIN_REQ_TABS = [
  {key:'review_pending', label:'بانتظار المراجعة الإدارية'},
  {key:'review_approved', label:'معتمدة من الإدارة'},
  {key:'review_rejected', label:'مرفوضة من الإدارة'},
  {key:'final_accepted', label:'مقبولة من الطرفين'},
  {key:'final_declined', label:'مرفوضة من الأعضاء'},
  {key:'withdrawn', label:'منسحبة'},
  {key:'all', label:'الكل'},
];
let adminReqTab = 'review_pending';
function reqCardHtml(r, rev, codeMap, actions){
  const senderCode = codeMap[r.sender_id] || r.sender_id;
  const recipientCode = codeMap[r.recipient_id] || r.recipient_id;
  return `<div class="card card-tight" id="admin-req-${r.id}" style="margin-bottom:10px;">
    <p class="mb0"><strong>رقم الطلب:</strong> <span class="muted">${r.id}</span></p>
    <p class="mb0"><strong>المرسل:</strong> <span class="admin-link" data-open-user="${r.sender_id}">${senderCode}</span></p>
    <p class="mb0"><strong>المستقبل:</strong> <span class="admin-link" data-open-user="${r.recipient_id}">${recipientCode}</span></p>
    <p class="mb0"><strong>تاريخ الإرسال:</strong> ${new Date(r.created_at).toLocaleString('ar-EG')}</p>
    <p class="mb0"><strong>حالة الطلب:</strong> ${L('request_status', r.status)}</p>
    <p class="mb0"><strong>حالة المراجعة الإدارية:</strong> ${rev? L('review_decision', rev.decision) : '—'}${rev&&rev.reason?` — السبب: ${rev.reason}`:''}</p>
    ${actions||''}
  </div>`;
}
async function renderAdminRequestsPanel(){
  const container = document.getElementById('admin-req-container');
  if(!container) return;
  container.innerHTML = `<div class="admin-subtabs">${ADMIN_REQ_TABS.map(t=>`<div class="admin-subtab ${adminReqTab===t.key?'active':''}" data-reqtab="${t.key}">${t.label}</div>`).join('')}</div><div id="admin-req-list">${loadingBox()}</div>`;
  container.querySelectorAll('[data-reqtab]').forEach(el=>el.onclick=()=>{ adminReqTab = el.dataset.reqtab; renderAdminRequestsPanel(); });
  await renderAdminRequestsList();
}
async function renderAdminRequestsList(){
  const list = document.getElementById('admin-req-list');
  if(!list) return;
  if(!S.adminPerms['requests.view'] && !S.adminPerms['requests.review']){
    list.innerHTML = emptyBox('🔒','لا تملك صلاحية','تحتاج صلاحية requests.view أو requests.review لعرض هذا القسم.');
    return;
  }
  try{
    let reqs = []; let reviewMap = {};
    if(adminReqTab==='review_pending' || adminReqTab==='review_approved' || adminReqTab==='review_rejected'){
      const decision = adminReqTab==='review_pending' ? 'pending' : adminReqTab==='review_approved' ? 'approved' : 'rejected';
      const {data: reviews, error} = await sb.from('marriage_request_reviews').select('*').eq('decision',decision).order('created_at',{ascending:false});
      if(error) throw error;
      if(!reviews.length){
        list.innerHTML = decision==='pending'
          ? emptyBox('✅','لا توجد طلبات بانتظار المراجعة','كل الطلبات تمت مراجعتها حتى الآن.')
          : emptyBox('📭','لا توجد طلبات بهذه الحالة','لا توجد طلبات مطابقة حاليًا.');
        return;
      }
      const {data: reqRows, error:e2} = await sb.from('marriage_requests').select('*').in('id', reviews.map(r=>r.request_id));
      if(e2) throw e2;
      const reqMap = Object.fromEntries(reqRows.map(r=>[r.id,r]));
      reqs = reviews.map(rv=>reqMap[rv.request_id]).filter(Boolean);
      reviewMap = Object.fromEntries(reviews.map(rv=>[rv.request_id, rv]));
    }else{
      let q = sb.from('marriage_requests').select('*').order('created_at',{ascending:false}).limit(200);
      if(adminReqTab==='final_accepted') q = q.eq('status','accepted');
      else if(adminReqTab==='final_declined') q = q.eq('status','declined');
      else if(adminReqTab==='withdrawn') q = q.eq('status','withdrawn');
      const {data, error} = await q;
      if(error) throw error;
      reqs = data||[];
      if(reqs.length){
        const {data: reviews} = await sb.from('marriage_request_reviews').select('*').in('request_id', reqs.map(r=>r.id));
        reviewMap = Object.fromEntries((reviews||[]).map(rv=>[rv.request_id, rv]));
      }
    }
    if(!reqs.length){ list.innerHTML = emptyBox('📭','لا توجد طلبات','لا توجد طلبات مطابقة لهذا التصنيف حاليًا.'); return; }
    let codeMap = {};
    try{
      if(!adminAllAccountsCache) adminAllAccountsCache = await api.adminListAllAccounts();
      codeMap = Object.fromEntries(adminAllAccountsCache.map(a=>[a.account_id, a.member_code]));
    }catch(_){ /* leave codeMap empty — UI falls back to raw UUID */ }
    const showActions = adminReqTab==='review_pending' && S.adminPerms['requests.review'];
    // Reopening only makes sense for a request the admin already decided on
    // (review_approved/review_rejected tabs) and only while it's still untouched by the
    // two members (status still 'pending') — matches admin_reopen_marriage_request_review's
    // own guard, which rejects reopening once someone has accepted/declined/withdrawn it.
    const showReopen = (adminReqTab==='review_approved' || adminReqTab==='review_rejected') && S.adminPerms['requests.review'];
    list.innerHTML = reqs.map(r=>{
      const rev = reviewMap[r.id];
      let actions = '';
      if(showActions) actions = `<div class="flex gap8" style="margin-top:10px;"><button class="btn btn-success btn-sm" data-approve="${r.id}">اعتماد</button><button class="btn btn-danger btn-sm" data-reject="${r.id}">رفض</button></div>`;
      else if(showReopen && r.status==='pending') actions = `<div class="flex gap8" style="margin-top:10px;"><button class="btn btn-outline btn-sm" data-reopen="${r.id}">إلغاء القرار ومراجعة الطلب مرة أخرى</button></div>`;
      return reqCardHtml(r, rev, codeMap, actions);
    }).join('');
    applyRequestHighlight('admin-req-');
    list.querySelectorAll('[data-open-user]').forEach(el=>el.onclick=()=>openAdminUserDetail(el.dataset.openUser));
    list.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{
      confirmModal('اعتماد الطلب','هل تعتمد هذا الطلب لإرساله للطرف المستقبل؟','اعتماد', async ()=>{
        try{ await api.adminReview(b.dataset.approve,'approved'); toast('تم الاعتماد','success'); renderAdminRequestsList(); }
        catch(e){ toast(friendlyError(e),'error'); }
      });
    });
    list.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{
      openModal(`<h3>سبب الرفض</h3><textarea id="rej-reason" placeholder="اذكر سبب الرفض (اختياري)"></textarea>
        <div class="flex gap8" style="justify-content:flex-end; margin-top:14px;">
          <button class="btn btn-ghost" id="rej-cancel">إلغاء</button><button class="btn btn-danger" id="rej-ok">تأكيد الرفض</button>
        </div>`, (root)=>{
        root.querySelector('#rej-cancel').onclick = closeModal;
        root.querySelector('#rej-ok').onclick = async ()=>{
          const reason = document.getElementById('rej-reason').value.trim();
          closeModal();
          try{ await api.adminReview(b.dataset.reject,'rejected',reason||null); toast('تم الرفض','success'); renderAdminRequestsList(); }
          catch(e){ toast(friendlyError(e),'error'); }
        };
      });
    });
    list.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{
      confirmModal('إلغاء قرار المراجعة','سيعود هذا الطلب إلى تبويب "بانتظار المراجعة الإدارية" ليُراجَع من جديد. متابعة؟','إلغاء القرار والمراجعة مرة أخرى', async ()=>{
        try{ await api.adminReopenReview(b.dataset.reopen); toast('تم إلغاء القرار — الطلب بانتظار المراجعة الآن','success'); renderAdminRequestsList(); }
        catch(e){ toast(friendlyError(e),'error'); }
      });
    });
  }catch(e){ list.innerHTML = errorBox(e); }
}

// Reads directly from admin_audit_log (same direct-table pattern already used for
// marriage_requests/marriage_request_reviews above) — RLS/Grants on that table decide
// what each admin can actually see, this just renders whatever comes back. Column
// names are read defensively (several likely names tried per field) since the exact
// schema isn't available from the frontend alone.
async function renderAdminAuditLog(){
  const box = document.getElementById('admin-audit-log');
  if(!box) return;
  try{
    const {data, error} = await sb.from('admin_audit_log').select('*').order('created_at',{ascending:false}).limit(200);
    if(error) throw error;
    if(!data || !data.length){ box.innerHTML = emptyBox('📜','لا توجد سجلات تدقيق بعد','ستظهر هنا كل العمليات الحساسة التي ينفذها المشرفون.'); return; }
    let codeMap = {};
    try{
      if(!adminAllAccountsCache) adminAllAccountsCache = await api.adminListAllAccounts();
      codeMap = Object.fromEntries(adminAllAccountsCache.map(a=>[a.account_id, a.member_code]));
    }catch(_){}
    box.innerHTML = data.map(row=>{
      const adminId = row.admin_user_id || row.actor_id || row.admin_id || row.performed_by || null;
      const adminCode = adminId ? (codeMap[adminId]||adminId) : '—';
      const action = row.action || row.action_type || row.event_type || '—';
      const targetId = row.target_id || row.target_user_id || row.subject_id || null;
      const targetCode = targetId ? (codeMap[targetId]||targetId) : null;
      const when = row.created_at ? formatDateTimeAr(row.created_at) : '—';
      const details = row.details || row.metadata || row.notes || null;
      const detailsStr = details ? (typeof details==='string' ? details : JSON.stringify(details)) : null;
      return `<div class="card card-tight" style="margin-bottom:8px;">
        <div class="flex-between"><strong>${action}</strong><span class="muted" style="font-size:12px;">${when}</span></div>
        <p class="mb0">المشرف: ${adminId?`<span class="admin-link" data-open-user="${adminId}">${adminCode}</span>`:'—'}</p>
        ${targetCode?`<p class="mb0">الهدف: <span class="admin-link" data-open-user="${targetId}">${targetCode}</span></p>`:''}
        ${detailsStr?`<p class="mb0 muted" style="font-size:12.5px;word-break:break-word;">${detailsStr}</p>`:''}
      </div>`;
    }).join('');
    box.querySelectorAll('[data-open-user]').forEach(el=>el.onclick=()=>openAdminUserDetail(el.dataset.openUser));
  }catch(e){ box.innerHTML = errorBox(e); }
}

/* =========================================================
   18. INITIALIZATION — session bootstrap, avoids infinite loading
========================================================= */
async function bootAfterAuth(session){
  S.session = session;
  await loadAccountContext();
}
let authListenerFired = false;
sb.auth.onAuthStateChange(async (event, session)=>{
  if(event==='SIGNED_OUT'){
    Object.assign(S, {session:null, account:null, profile:null, profileStatus:null, prefStatus:null, isAdmin:false, adminPerms:{}, favoriteIds:null});
    if(S.booted) render();
    return;
  }
  if(session){
    S.session = session;
    if(S.booted){ await loadAccountContext(); render(); }
  }
});

(async function init(){
  initTheme();
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(session){ await bootAfterAuth(session); }
  }catch(e){ console.error(e); }
  finally{
    S.booted = true;
    render();
  }
})();
// safety net: never leave the user stuck on nothing
setTimeout(()=>{ if(!S.booted){ S.booted = true; render(); } }, 6000);
</script>
